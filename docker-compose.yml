# 全局日志配置: 每个容器最多保留 7 个日志文件，每个文件最大 10MB
# 日志自动轮转，相当于保留约 7 天的日志（取决于日志量）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      TZ: Asia/Shanghai
    # MySQL不暴露端口到主机,仅容器内部访问
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./scripts:/app/scripts:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    # Redis不暴露端口到主机,仅容器内部访问
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # Schema sync service - runs once to sync database schema
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/check-schema.sh
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SERVER_PORT: 8080
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-adminadmin}
      # Agent API Configuration (V2 review via agent.scholay.com)
      AGENT_API_URL: ${AGENT_API_URL:-https://agent.scholay.com}
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      # Frontend URL for SSR code snippet injection (use service name, not container_name)
      FRONTEND_USER_URL: http://frontend-user:80
      # SigNoz Configuration
      SIGNOZ_ENDPOINT: ${SIGNOZ_ENDPOINT:-http://198.44.187.186:4318}
      SIGNOZ_SERVICE_NAME: ${SIGNOZ_SERVICE_NAME:-scholar-backend}
      SIGNOZ_ENVIRONMENT: ${SIGNOZ_ENVIRONMENT:-production}
      SIGNOZ_ENABLE_TRACING: ${SIGNOZ_ENABLE_TRACING:-true}
      SIGNOZ_ENABLE_LOGGING: ${SIGNOZ_ENABLE_LOGGING:-true}
      SIGNOZ_ENABLE_METRICS: ${SIGNOZ_ENABLE_METRICS:-true}
      SIGNOZ_SAMPLING_RATE: ${SIGNOZ_SAMPLING_RATE:-1.0}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/app/uploads
    # Backend不暴露端口,通过Nginx访问
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    # Frontend不暴露端口,通过Nginx访问
    expose:
      - "80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  nginx:
    image: nginx:alpine
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-5411}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/nginx-cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend-user
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge
