# 全局日志配置: 每个容器最多保留 7 个日志文件，每个文件最大 10MB
# 日志自动轮转，相当于保留约 7 天的日志（取决于日志量）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

# 时区统一为北京时间 —— 由仓库自带的时区文件钉死,不依赖宿主机配置。
#
# 2026-07-15 事故修复:旧策略是「跟随宿主」(挂宿主 /etc/localtime)。本地宿主是北京时间
# 一切正常,但生产云主机系统时区是 UTC 时,全部容器整体跑 UTC —— 每日额度按 UTC 日期
# 滚动,北京 0 点不重置、8 点才重置(用户实际反馈的事故)。业务口径就是北京时间,
# 故改为挂**仓库内置**的 docker/tz/Asia-Shanghai(IANA TZif,公有领域),主机时区任意
# 均不影响;主机只需保证 NTP 对时(绝对时间)。
#
# TZ 值用冒号前缀 `:/etc/localtime` 是 POSIX libc 标准语法:
# 告诉 libc 不要去查 /usr/share/zoneinfo,直接读这个文件作为 tz 数据。
# 这样无论镜像有没有装 tzdata(alpine 默认就没,如 umami/minio),行为完全一致。
#
# 配合 volumes 里挂 `- ./docker/tz/Asia-Shanghai:/etc/localtime:ro`。
# YAML 不能合并列表,所以 volumes 那行每个服务都手写。
x-tz-env: &tz-env
  TZ: ":/etc/localtime"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
    # MySQL不暴露端口到主机,仅容器内部访问
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    # --slow-query-log=0: 关掉慢查询日志, 之前默认 ON 时写 /var/lib/mysql/slow.log,
    # 该文件挂到 host 的 data/mysql/ 下, 无 rotation, 长期会无限增长。没有 admin
    # 工具消费它, 需要排查慢查询时临时打开即可 (`SET GLOBAL slow_query_log='ON'`)。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --slow-query-log=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # MinIO 对象存储 —— 用户上传的 PDF 文件本体存放在这里
  # MySQL 只存元数据(object_key/size/sha256/uploaded_at),文件不入库
  # 兼容 S3 API,以后真要切阿里云 OSS / 腾讯 COS 只换 endpoint + credentials
  minio:
    image: minio/minio:latest
    container_name: scholar_minio
    restart: unless-stopped
    logging: *default-logging
    # 仅容器内部访问 API(9000);9001 是 web 控制台,不暴露主机(需要时再开)
    expose:
      - "9000"
      - "9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scholarminiopass}
    volumes:
      - ./data/minio:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      # MinIO 自带的就绪探针 —— 等服务起来 + 至少一块盘就绪
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    # Redis不暴露端口到主机,仅容器内部访问
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    # AOF: appendfsync everysec 显式声明（每秒 fsync，性能/持久化平衡的常规选择）
    # slowlog: 记录 >10ms 的命令，最多保留 256 条，用于排查热点 key 与慢命令
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --slowlog-log-slower-than 10000
      --slowlog-max-len 256
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # Redis(correctness 键专用,noeviction)—— 可选。
  # 吊销标记 / 每日配额 / SEO 推送队列等不能被 LRU 静默逐出的键放这里(主 Redis 是 allkeys-lru,
  # 内存打满会逐出任意键 → 吊销复活 / 配额清零)。启用方式:在 .env 设
  #   REDIS_PERSIST_HOST=scholar_redis_persist
  # backend 未设该 env 时这些键回落主 Redis(行为同今天),本容器闲置无害。
  # maxmemory-policy noeviction:写满即返回 OOM 错误而非逐出 —— correctness 键宁可写失败也不静默丢。
  redis-persist:
    image: redis:7-alpine
    container_name: scholar_redis_persist
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis-persist:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # 数据库迁移服务 - 每次启动按顺序执行 migrations/ 下的 SQL 文件
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      # 给 run-migrations.sh 用,首次启动幂等创建 umami 库并授权 scholar_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./docker/mysql/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts:/app/scripts:ro
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/run-migrations.sh
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # Web-native 重构 P2:correctness 键(验证码/吊销/配额 + 未来 agent 事件流)走专用 noeviction
      # 实例(scholar_redis_persist),不被主池 512MB allkeys-LRU 静默逐出(复盘点出的真风险)。
      REDIS_PERSIST_HOST: ${REDIS_PERSIST_HOST:-redis-persist}
      REDIS_PERSIST_PORT: ${REDIS_PERSIST_PORT:-6379}
      REDIS_PERSIST_PASSWORD: ${REDIS_PERSIST_PASSWORD:-}
      REDIS_PERSIST_DB: ${REDIS_PERSIST_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SERVER_PORT: 8080
      # gin 运行模式: 默认 release(去掉 debug 路由噪声 + 每请求 debug 开销)。本机调试路由时
      # 在 .env 里设 GIN_MODE=debug 覆盖。不设而落 debug 是性能审计 be-http 的一个点。
      GIN_MODE: ${GIN_MODE:-release}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-adminadmin}
      FRONTEND_USER_URL: http://frontend-user:80
      # 测试支付:开后「账户资产」出现"测试支付"按钮, 下单后一键完成履约(无网关)。生产务必 false。
      PAYMENT_TEST_ENABLED: ${PAYMENT_TEST_ENABLED:-false}
      # 站点 / 第三方服务地址 —— 来源是 .env 的 SITE_URL 等单一变量,这里 fan-out 给 backend
      SEO_BASE_URL: ${SITE_URL:-https://www.scholay.com}
      # 公网 origin 原值也直接透传(邀请分享链接等要拼用户可达的公网 URL;
      # FRONTEND_USER_URL 是容器内网地址,不能给用户)
      SITE_URL: ${SITE_URL:-https://www.scholay.com}
      SITE_NAME: ${SITE_NAME:-Scholay}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@scholay.com}
      # 主动 SEO 提交(详见 .env 注释段)
      SEO_SUBMIT_ENABLED: ${SEO_SUBMIT_ENABLED:-false}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BAIDU_PUSH_ENABLED: ${BAIDU_PUSH_ENABLED:-false}
      BAIDU_PUSH_TOKEN: ${BAIDU_PUSH_TOKEN:-}
      BAIDU_PUSH_SITE: ${BAIDU_PUSH_SITE:-}
      BAIDU_PUSH_DAILY_QUOTA: ${BAIDU_PUSH_DAILY_QUOTA:-1000}
      SEO_PUSH_WORKER_INTERVAL_SECONDS: ${SEO_PUSH_WORKER_INTERVAL_SECONDS:-300}
      SEO_PUSH_BATCH_SIZE: ${SEO_PUSH_BATCH_SIZE:-100}
      # Google Search Console HTML-tag 验证(meta content 值;DNS TXT 验证时留空)
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # SEO 完整性回填(H1 论文摘要 + M2 冷门 URL 现拉):默认关,置 true 才消耗 minicod 配额
      SEO_ENRICH_ENABLED: ${SEO_ENRICH_ENABLED:-false}
      # M2 现拉的每小时全局配额。爬虫 UA 一律不放行(硬编码),这个数只管「非爬虫」那部分:
      # 0 = 不限;留空取默认 200(≈ 真人实体页浏览量的 100 倍余量)。理由见
      # backend/internal/config/ssr_onmiss_gate.go 文件头。必须在这里透传,否则 .env 里设了不生效。
      SEO_ONMISS_HOURLY_BUDGET: ${SEO_ONMISS_HOURLY_BUDGET:-}
      # MinIO 对象存储(用户上传 PDF) —— endpoint 用容器名 minio:9000
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scholarminiopass}
      MINIO_BUCKET_PAPER_PDFS: ${MINIO_BUCKET_PAPER_PDFS:-scholar-paper-pdfs}
      # agent 输入框上传附件(0112 耐久化)。⚠️ 其余几个桶(feedback/peer-review/prism/
      # agent-artifacts/skill-bundles)靠 config.go 的默认值,不在这里透传;这一条显式写出来
      # 是因为它已写进 .env.example —— 文档里有、compose 不透传 = 改了不生效的静默陷阱。
      MINIO_BUCKET_AGENT_ATTACHMENTS: ${MINIO_BUCKET_AGENT_ATTACHMENTS:-scholar-agent-attachments}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # 附件孤儿对象 reaper 是否真删(默认 false = 只报告)。同上一条的理由必须显式透传:
      # 写进了 .env.example 却不透传 = 运维照文档设了 true 却毫无效果的静默陷阱。
      AGENT_ATTACHMENT_REAPER_DELETE: ${AGENT_ATTACHMENT_REAPER_DELETE:-false}
      # CORS —— fan-out 自 .env(默认 * 允许任意 origin,生产请改具体域名列表)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # ─── Umami HTTP API 接入 ───
      # backend internal/umami 通过 umami:3000 拉取统计,admin /analytics 自渲染图表。
      # 内网 URL + 默认 admin/umami 都写死在 client.go 里,这里只需告诉 backend WebsiteID。
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # 爬虫监控专用 website(必须与上面的用户统计站点分开):后端识别到搜索引擎/AI
      # 爬虫时服务端旁路上报,后台「数据统计 → 搜索引擎抓取」读它。Umami 原生 JS
      # tracker 看不到爬虫(不执行 JS + 服务端 isbot 过滤),所以只能走这条旁路。
      # 留空 = 中间件完全不挂载,零开销。
      UMAMI_CRAWLER_WEBSITE_ID: ${UMAMI_CRAWLER_WEBSITE_ID:-}
      UMAMI_CRAWLER_BASE_URL: ${UMAMI_CRAWLER_BASE_URL:-}
      # AI Agent 桥接 —— backend POST agent /api/providers 必须带这个 Bearer
      # 与 agent 容器的 ANTHROPIC_API_KEY 同源 (AGENT_INTERNAL_TOKEN)。
      # P6:fork 已退役,后端唯一 agent 后端 = clean-room executor。默认即指向 executor,
      # docker compose up -d --build 开箱即用,无需手动设 cutover env。
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://scholar_agent:3456}
      AGENT_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      # Web-native 重构(事件溯源脊柱)。P6 后 executor 是唯一后端,journal 是历史唯一真源 → 默认 shadow。
      #   AGENT_TURN_JOURNAL=shadow   → turn 账本/事件日志/计费(executor 历史读它;老会话回退 agent_session_archive)
      #   AGENT_JOURNAL_VALIDATE=on   → 后台持续校验(只读、只 slog)
      AGENT_TURN_JOURNAL: ${AGENT_TURN_JOURNAL:-shadow}
      AGENT_JOURNAL_VALIDATE: ${AGENT_JOURNAL_VALIDATE:-}
      AGENT_JOURNAL_READ: ${AGENT_JOURNAL_READ:-}
      # executor 路由:P6 后所有 feature 都走 executor(fork 已删)。默认即指向 executor + 全 feature,
      # 与 AGENT_BASE_URL 同一 executor;开箱即用,无需手动 env。
      AGENT_EXECUTOR_BASE_URL: ${AGENT_EXECUTOR_BASE_URL:-http://scholar_agent:3456}
      AGENT_EXECUTOR_FEATURES: ${AGENT_EXECUTOR_FEATURES:-smart_search,claw,prism,peerreview,boltslides,sci_draw,stat_lab}
      # P6 一次性归档(已执行完毕):仅在带 fork 的迁移那次部署设为 1。fork 已删,保持空。
      AGENT_ARCHIVE_FROM_FORK: ${AGENT_ARCHIVE_FROM_FORK:-}
      # P6 历史迁移:开机从老 fork jsonl(/fork-data,只读挂载)折叠归档老会话(幂等,迁完自动 no-op)。
      AGENT_ARCHIVE_FROM_JSONL: ${AGENT_ARCHIVE_FROM_JSONL:-/fork-data}
      # C14 审批轴 **dev/测试** 开关: =1 时 claw 切 passthrough(permission_request 透传前端人审,
      # 绕过后端自动裁决)。默认空 = auto,行为与改造前一致。
      # ⚠️ docker-compose.prod.yml **故意不含此项**(生产恒 auto);仅本地保留以便测 passthrough/未来 HITL。
      CLAW_PERMISSION_PASSTHROUGH: ${CLAW_PERMISSION_PASSTHROUGH:-}
      # 智能审稿: backend 按 slug 读审稿人 skill 的「评分人格」段注入评分轮 (见 peerreview)。
      # 只读挂载与 agent 同一份 committed skills 目录 (单一真相源)。
      PEERREVIEW_SKILLS_DIR: ${PEERREVIEW_SKILLS_DIR:-/app/reviewer-skills}
      # 审查视角(lens)库:多技能组合 —— 每位审稿人可叠加 0-2 个 lens。backend 按 slug 读 <<<LENS>>> 段。
      PEERREVIEW_LENSES_DIR: ${PEERREVIEW_LENSES_DIR:-/app/reviewer-lenses}
      # Prism 会话经 --add-dir 加载写作 skill 的目录(agent 容器内 <此处>/.claude/skills)。
      PRISM_SKILL_ADDDIR: ${PRISM_SKILL_ADDDIR:-/prism-add}
      # Prism base 写作人格库(pw-*):backend 只读,按 slug 读 <<<WRITING_PERSONA>>> 段 in-band 注入(Phase 2)。
      PRISM_PERSONAS_DIR: ${PRISM_PERSONAS_DIR:-/app/prism-personas}
      # smart_search 会话经 --add-dir 加载检索策略 skill 的目录(agent 容器内 <此处>/.claude/skills)。
      SMART_SEARCH_SKILL_ADDDIR: ${SMART_SEARCH_SKILL_ADDDIR:-/smart-search-add}
      # 制作PPT(boltslides)会话经 --add-dir 加载 bolt-slides skill 的目录(agent 容器内 <此处>/.claude/skills)。
      BOLT_SLIDES_SKILL_ADDDIR: ${BOLT_SLIDES_SKILL_ADDDIR:-/bolt-slides-add}
      # 科研绘图(sci_draw)会话经 --add-dir 加载绘图 skill 的目录(agent 容器内 <此处>/.claude/skills)。
      SCI_DRAW_SKILL_ADDDIR: ${SCI_DRAW_SKILL_ADDDIR:-/sci-draw-add}
      # 数据分析 skill 注入点(spec.go 的 statLabSkillAddDir 读它;缺省 /stat-lab-add)。
      STAT_LAB_SKILL_ADDDIR: ${STAT_LAB_SKILL_ADDDIR:-/stat-lab-add}
      # Prism 编译任务共享目录(与 scholar_prism_tex 同卷;后端写任务、watcher 编译回写)
      PRISM_WORK_DIR: ${PRISM_WORK_DIR:-/data/prism-work}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      # 审稿人 skill 库 (reviewer-roster + rv-*): backend 只读, 按 slug 读 SCORING_PERSONA 段。
      # P6:fork 退役后 skill 源移到 ./agent-skills/(与 executor 的 --add-dir 挂载同源)。
      - ./agent-skills/reviewer-skills:/app/reviewer-skills:ro
      # 审查视角(lens)库 —— 多技能组合,backend 只读读 <<<LENS>>> 段拼进审稿人 prompt。
      - ./agent-skills/reviewer-lenses:/app/reviewer-lenses:ro
      # Prism base 写作人格库(pw-*):backend 只读读 <<<WRITING_PERSONA>>> 段 in-band 注入(Phase 2)。
      - ./agent-skills/prism-personas:/app/prism-personas:ro
      # Prism 编译任务共享卷:后端写「任务目录+.request」,scholar_prism_tex watcher 轮询编译回写 PDF/log。
      - ./data/prism-work:/data/prism-work
      # P6 历史迁移:老 fork jsonl 只读挂入,开机自动折叠归档进 agent_session_archive(幂等,迁完即 no-op)。
      - ./data/agent:/fork-data:ro
    # Backend不暴露端口,通过Nginx访问
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # correctness 键池:必须等它 healthy 再起 backend。InitRedisPersist 连不上是**静默降级**
      # (回落主 Redis + 一条 Warn),冷启动竞速会让额度键悄悄躺回会被 LRU 逐出的主池 ——
      # 那正是 2026-08-02 审计 P0-1 的现网形态。用 depends_on 把它变成确定性的。
      redis-persist:
        condition: service_healthy
      minio:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network
      # backend 同时在 scholar-agent-net 上, 才能解析/调用 scholar_agent:3456
      # (CreateSession / ServerSideChat / WS 推送)。注意是单向: agent 侧只看得到 backend,
      # 看不到 mysql/redis/minio —— 即便 agent 被攻陷也够不到数据面。
      - scholar-agent-net

  # ── Web-native clean-room agent(源在 agent/)。唯一 agent 后端 ──
  # 原 cc-haha fork 已退役;这是从零自建的 provider-agnostic 执行器,沿用 agent 命名(镜像/容器/主机名),
  # 与 build-and-push.sh / deploy.sh 的 `agent` 镜像一致。后端拥有 state(journal + agent_session_archive);
  # 执行器按轮无状态。4 个 feature(smart_search/claw/prism/peerreview)全部走它。
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: scholar_agent
    restart: unless-stopped
    # init: true —— 让 docker 塞一个 PID 1 的 init 进程负责 reap 僵尸子进程。
    # 🔴 不加这行的后果(dev 实测):单会话 4 分钟漏 78 个 pid、累计 82 个僵尸,PPID=1 永不回收。
    #    Bash 工具每次起子进程(bwrap → sh → python/pandoc),bun 不是 init、不 reap ⇒ 只增不减。
    #    prod 有 `pids: 512` 上限 ⇒ 约 6 个重 Bash 会话就打满,之后该容器所有 Bash 全失败,
    #    且**只能靠重启复位**。Run 引擎会把 Bash 调用集中到少数 Step,压强只会更高。
    init: true
    logging: *default-logging
    environment:
      <<: *tz-env
      # 2026-07-15 时区彻查:Bun/JavaScriptCore(ICU)不认 ":/etc/localtime" 的 libc 文件写法,
      # JS 层 new Date() 仍是 UTC(日志时间戳/会话 createdAt 错位;业务日期由 clock.ts 固定 +8
      # 兜底不受影响)。IANA 名字形式两层(libc date + JS ICU)实测都认 —— 本服务覆写为名字形式;
      # 其余 alpine 系服务无 tzdata 只认文件挂载,保持 ":/etc/localtime" 不动。
      TZ: "Asia/Shanghai"
      PORT: 3456
      # M3:会话 cwd 根必须与 backend 权限判定的 agentSessionWorkdirRoot() 默认(/home/bun/sessions)一致,
      # 否则 agent 提出的**绝对路径**文件操作会被后端权限判定按错根 confine → 误 DENY(相对路径不受影响,
      # 故是 latent 间歇)。统一到 /home/bun/sessions(fork agent 容器也是这个根)。
      SESSIONS_ROOT: /home/bun/sessions
      # 内网 Bearer:与 backend 的 AGENT_AUTH_TOKEN / agent 的 ANTHROPIC_API_KEY 同源,否则 PushConfig 401。
      EXECUTOR_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      # Minicod MCP 凭证(执行器 spawn @minicod/mcp-server stdio 时透传)。
      # 与 docker-compose.prod.yml 一致:agent 的 minicod key 统一取 .env 的 AGENT_MINICOD_API_KEY。
      MINICOD_API_KEY: ${AGENT_MINICOD_API_KEY:-}
      MINICOD_API_BASE_URL: ${MINICOD_API_BASE_URL:-https://www.minicod.com/v1}
      # ExportDocument 的 PDF 引擎(镜像已装 weasyprint;registry.ts 读此 env 启用 pdf 目标)。
      EXECUTOR_PDF_ENGINE: weasyprint
      # 并发槽(prod 默认 4 + RSS 水位闸,见 docker-compose.prod.yml 同名项与 admission.ts)
      EXECUTOR_MAX_CONCURRENT_TURNS: ${EXECUTOR_MAX_CONCURRENT_TURNS:-4}
      # 沙箱:none(本地/默认) | bwrap(仅生产真内核,P4b)。
      # 出网:egress 容器已合并 —— agent 直接经 egress-net(NAT)访问公网,不再走独立代理。
      # 数据面隔离仍在:agent 只在 scholar-agent-net(backend)+ egress-net(外网),**不**接 scholar-network
      # → 碰不到 mysql/redis/minio。bash 工具的网络由 bwrap 沙箱(生产)管控。
    expose:
      - "3456"
    # H5:不再向 host 映射端口。executor 只走 docker 内网(backend 经 scholar-agent-net 访问);
    # 避免整个 executor API(provider 密钥 / 全 workspace 文件 op / 路径穿越面)从 host/LAN 可达。
    # 临时本机调试可临时加回 `ports: ["3460:3456"]`,但**绝不进生产**。
    volumes:
      # H6:per-feature skill / CLAUDE.md(--add-dir),镜像 fork agent 的挂载,使 claw/prism/peerreview
      # 切到 executor 后仍加载各自 skill(claw 渲染约束 / prism 写作格式 / peerreview 评审人格)。
      - ./agent-skills/claw-add:/claw-add:ro
      - ./agent-skills/prism-skills:/prism-add/.claude/skills:ro
      # Prism 写作 lens(craft/rigor):按需加载(guides/ → 菜单行常驻 + Skill 工具懒加载正文)。
      - ./agent-skills/prism-lenses:/prism-add/guides:ro
      # ⚠️ 这里曾有 `./agent-skills/reviewer-skills:/peerreview-add/.claude/skills:ro`,
      #    2026-08 证据账本 P0-a 删除。理由不是「没用到所以清理」,而是它是个**回归陷阱**:
      #    ① 零调用者 —— 审稿走 server-side(peerreview/service.go:613 起已明确不再 AddDirs 加载
      #       reviewer-skills:花名册改 in-band 注入、评分轮按 slug 后端读 SKILL.md 注入 persona)。
      #       backend 的 reviewerSkillAddDir()(service_reviewers.go:96)当前**无任何调用点**,
      #       PEERREVIEW_SKILL_ADDDIR 也未在任何 env 里设过。挂载在容器里躺着,没人读。
      #    ② 而它一旦被「顺手用起来」就会静默劣化:reviewer-skills 共 33 份 SKILL.md / 132KB,
      #       远超 loader 的 TOTAL_CAP=40000(agent/src/skills/loader.ts:15)。loader 按目录名
      #       .sort() 确定性截断,实测在第 12 个目录 rv-domain-genomics 处触帽 → 排在其后的
      #       **全部 6 个横切质量维度**(rv-integrity / rv-methodology / rv-novelty /
      #       rv-reproducibility / rv-theory / rv-writing)+ 14 个领域人格被整体丢弃,
      #       而日志里只有一条 warn。「配了却只生效三分之一」比「没配」更难发现。
      #    结论:留着 = 给未来某人补一行 AddDirs 就踩坑的现成弹药。要恢复请先解掉 40KB 帽的冲突
      #    (挂一个只含 reviewer-roster 的精简目录),而不是把整个 reviewer-skills 挂回来。
      #    注:backend 侧的 `./agent-skills/reviewer-skills:/app/reviewer-skills:ro` 是另一份挂载,
      #    评分轮真的在读它(PEERREVIEW_SKILLS_DIR),**必须保留**,别一起删。
      # smart_search 检索策略 skill(minicod-search-strategy):查询拆解 / 引文滚雪球 / 覆盖度自检。
      - ./agent-skills/smart-search-skills:/smart-search-add/.claude/skills:ro
      # 制作PPT(boltslides)bolt-slides 演示稿创作 skill。
      - ./agent-skills/bolt-slides-add:/bolt-slides-add/.claude/skills:ro
      # 科研绘图(sci_draw)手写 SVG 绘图 skill。
      - ./agent-skills/sci-draw-skills:/sci-draw-add/.claude/skills:ro
      # 数据分析 skill:问诊协议 / verb 编排 / 解读口径 / 红线话术(只在 stat_lab 会话装)
      - ./agent-skills/stat-lab-skills:/stat-lab-add/.claude/skills:ro
      # 会话工作目录(cwd + 上传文件 + analysis/ 的 bundle + out/ 的交付物)持久化。
      # 不挂 = 只活在容器可写层,任何 `up -d --build` 都清空;旧会话续聊报
      # "Working directory does not exist"。属主由镜像 entrypoint chown 自愈。
      #
      # 🔴 2026-08-06 补回。这一行**曾经有过**(250cad3a2,2026-06-04),在 a30add8d2
      #    「优化 agent架构」(2026-06-30)把整个 volumes 块从 ./agent/data/claude/* 重写成
      #    ./agent-skills/* 时**被顺带删掉** —— prod 同 commit 里保住了(prod.yml 至今在挂),
      #    于是 dev 与 prod 悄悄漂移了两个月。
      #    代价是实的:`analysis/*.bundle.json` 是「交付物里每个数字可溯源」的**唯一**源
      #    (numcheck 的 sources 全部来自它),而交付物本身在 MinIO 里是 upsert-only 永久留存 ⇒
      #    源随容器重建即灭。实测 209 个 stat_lab 会话里 **203 个的 bundle 已不可复核**,
      #    report 生成的 analysis.py 引用的数据文件也一并没了,「审稿人可原样重跑」当场作废。
      #    (BUILD-P0开工方案.md:2174 把这个风险登记为「第 31 天数字出处消失」;实测是第 1 天。)
      #    顺带一提 backup-all.sh 备的就是这个宿主目录 —— 没有挂载时它备的是一份陈旧快照,**假绿**。
      #
      # ⚠️ 同一次重写还删掉了 `/etc/localtime`,那条在 2026-07 被单独补回(见下一条)——
      #    也就是说当时**已经发现整块重写有漏项并排查过一轮,却只补了一条**。
      #    所以真正的防线不是这行注释,是 src/server/composeVolumeParity.test.ts:
      #    它把两份 compose 的 agent volumes 集合钉在一起,下次整块重写会当场红。
      - ./data/agent-sessions:/home/bun/sessions
      # 时区跟随宿主(2026-07 补):oven/bun:1-slim 无 tzdata,TZ=":/etc/localtime" 此前指向
      # 不存在的文件 → 容器实际跑 UTC(北京时间每天 0:00-8:00 日期差一天,claw 跑 `date` 也是 UTC)。
      # JS 侧 src/tools/clock.ts 另有固定 +8 实现,不依赖此挂载;这里是给 Bash `date` / 日志对齐。
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3456/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # bwrap 内层沙箱(2026-07-15):Docker 默认 seccomp 把 userns/mount 系统调用门禁在
      # CAP_SYS_ADMIN 之后,cap_drop=ALL 时 bwrap 建不了命名空间。本 profile = Docker 默认
      # + 仅放行 clone/unshare/setns/mount/umount2/pivot_root(不放 bpf/perf_event_open 等),
      - seccomp=./docker/seccomp/agent-bwrap.json
      # AppArmor(2026-07-23 线上实测):Ubuntu 24.04 宿主上有**两层独立拦截**,seccomp 放行了也不够:
      # ① docker-default profile 无 mount 规则 → jail 内 mount --make-slave / 被拒("Failed to make / slave");
      # ② 宿主 sysctl apparmor_restrict_unprivileged_userns=1 把 unconfined 进程建 userns 转入
      #    unprivileged_userns 桩 profile(拒 capability)→ uid map 失败。
      # 两层同时解:本行摘 docker-default + 宿主跑 scripts/enable-bwrap-host.sh(sysctl=0),缺一 bwrap 起不来。
      # 摘 AppArmor 后防线仍有:cap_drop ALL + no-new-privileges + 上面的自定义 seccomp + bwrap 内层 jail。
      # macOS Docker Desktop 无 AppArmor,本行为 no-op(与生产对齐保留)。
      - apparmor=unconfined
    networks:
      - scholar-agent-net # backend ↔ agent(internal,无 NAT)
      - egress-net        # agent → 公网(NAT;此网无数据面,故 agent 仍碰不到 mysql/redis)

  # (已删除)原 egress-proxy(tinyproxy)容器:agent 现直连公网(经 egress-net NAT),出口逻辑已并入 agent。

  # Scholay Prism LaTeX 编译沙箱 (源在 prism_tex/)。
  # 与后端只经共享卷 ./data/prism-work 通信(watcher 轮询任务),故 network_mode: none 彻底断网。
  # 纵深防御: 无 cap / 无网络 / 只读 rootfs / no-new-privileges / pids·mem·cpu 限额 + 编译超时。
  prism-tex:
    build:
      context: ./prism_tex
      dockerfile: Dockerfile
    container_name: scholar_prism_tex
    # 与 backend(appuser uid 1001)同 uid 跑,才能写回共享卷里 backend(1001)建的编译任务目录。
    user: "1001:1001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      COMPILE_TIMEOUT: ${PRISM_COMPILE_TIMEOUT:-60}
      # 并发编译上限(评审 #11):默认 3,按宿主算力经 .env 调。必须与下面 CPU/内存配额同步。
      COMPILE_MAX_PARALLEL: ${PRISM_COMPILE_MAX_PARALLEL:-3}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 2026-07-15 时区彻查补挂:此前唯独本服务漏挂 → TZ=":/etc/localtime" 指向不存在的
      # 文件,LaTeX 编译沙箱实跑 UTC(\today 在北京 0-8 点差一天、编译日志时间错位)。
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      - ./data/prism-work:/work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        # 配额随 MAXPAR 同步(评审 #11):每个 latexmk ~0.5CPU + 250-400MB;MAXPAR=3 → 2CPU/1.5G 才不 OOM(137)/不拖慢到超时。
        limits:
          memory: 1536M
          cpus: "2.0"
          pids: 384
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 30 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 用户前端 (Vite + React 19,源在 frontend-user/)
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        # umami tracker 已改为运行时 fetch /api/v1/public/umami-config 拿 website_id,
        # 不需要 build-time 注入。换 umami DB / 重建 website 都无需 rebuild 前端。
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      # ⚠️ 这里【刻意不挂】./data/frontend-assets —— 这是 dev 与 prod 在本服务上的差异之一
      #    (另有 deploy.resources 等,别把这条当成"唯一差异")。
      #    那个卷的作用是「发版灰度」:保留旧 hash 分包,让发版前就开着的标签页不撞 404
      #    (详见 frontend-user/docker-entrypoint.d/40-sync-site.sh 的长注释)。
      #    但开发机没有「开了几天标签页的真实用户」,收益严格为零,
      #    代价却是按【构建频率】线性堆积 —— 实测一天 6 次构建 → 稳态 848MB / 3.4 万个 js。
      #    不挂载时容器直接吃镜像里的 /opt/dist,每次 rebuild 干净起步,行为完全正常。
      #    要在本地复现灰度行为(比如验证 40-sync-site.sh 的改动),把下面这行取消注释即可:
      # - ./data/frontend-assets:/usr/share/nginx/html/assets
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # ─── Umami 分析平台 ─────────────────────────────────────────────────
  # 单容器接入:
  #   - 镜像换 mysql-latest,DATABASE_URL 指 scholar_mysql 的 `umami` 库
  #     (该库 + 用户权限由 docker/mysql/initdb.d/01-umami-db.sql 首次启动时创建)
  #   - 不再暴露给主机:tracker (script + api/send) 由 nginx 反代,
  #     管理 UI 不再对外 —— admin /analytics 改为 backend HTTP API 自渲染图表
  #   - APP_SECRET 是 umami 容器自己签 token 用的,改值会让前端 tracker 老 hash 失效
  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: scholar_umami
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DATABASE_TYPE: mysql
      # connection_limit=5 显式限住 Prisma 连接池: 不设的话 Prisma 默认 num_cpus*2+1(8 核=17),
      # 与 backend 池(90)合计可能逼近/超过 MySQL max_connections=100, 触发 "Too many connections"。
      # umami 写入量很低, 5 条足够。性能审计 infra。
      DATABASE_URL: mysql://${MYSQL_USER:-scholar_user}:${MYSQL_PASSWORD:-scholar_pass}@mysql:3306/umami?connection_limit=5
      APP_SECRET: ${UMAMI_APP_SECRET:-change-this-umami-secret-in-production}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      # 注:Umami v3 没有 /api/heartbeat,/login 永远 200,作 readiness 探针够用。
      # 必须用 127.0.0.1 而非 localhost:busybox wget 先解析到 ::1(IPv6),而 Next.js 只绑
      # IPv4 0.0.0.0 → 恒 Connection refused → 容器被误标 unhealthy(线上/本机均躺了一周的假警报)。
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: scholar-nginx
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    ports:
      # 主入口 (含 /admin 路径)。umami UI / tracker 都通过这个端口的反代,不另开端口。
      # 默认只绑本机；真机/局域网联调时显式设 HTTP_BIND_ADDRESS=0.0.0.0。
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-5411}:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      - nginx-static-cache:/var/cache/nginx/static
    depends_on:
      - backend
      - frontend-user
      - umami
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

volumes:
  nginx-static-cache:

networks:
  scholar-network:
    driver: bridge
  # 安全隔离: backend↔agent 内部网,internal=无 NAT —— 此网无出口,agent 出公网走下面的 egress-net。
  scholar-agent-net:
    driver: bridge
    internal: true
  # agent 经这张网 NAT 出公网(原 egress-proxy 已删,出口并入 agent)。此网无数据面容器,
  # 故 agent 接入它也碰不到 mysql/redis/minio(那些在 scholar-network)。
  egress-net:
    driver: bridge
