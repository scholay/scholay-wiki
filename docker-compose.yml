# 全局日志配置: 每个容器最多保留 7 个日志文件，每个文件最大 10MB
# 日志自动轮转，相当于保留约 7 天的日志（取决于日志量）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

# 时区统一为北京时间 —— 所有容器跟随宿主机,不做任何 timezone 转换。
#
# TZ 值用冒号前缀 `:/etc/localtime` 是 POSIX libc 标准语法:
# 告诉 libc 不要去查 /usr/share/zoneinfo,直接读这个文件作为 tz 数据。
# 这样无论镜像有没有装 tzdata(alpine 默认就没,如 umami/minio),
# 全部都直接吃宿主挂进来的 /etc/localtime,行为完全一致。
#
# 配合 volumes 里挂 `- /etc/localtime:/etc/localtime:ro`,实现真正的"跟随宿主"。
# YAML 不能合并列表,所以 volumes 那行每个服务都手写。
x-tz-env: &tz-env
  TZ: ":/etc/localtime"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
    # MySQL不暴露端口到主机,仅容器内部访问
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    # --slow-query-log=0: 关掉慢查询日志, 之前默认 ON 时写 /var/lib/mysql/slow.log,
    # 该文件挂到 host 的 data/mysql/ 下, 无 rotation, 长期会无限增长。没有 admin
    # 工具消费它, 需要排查慢查询时临时打开即可 (`SET GLOBAL slow_query_log='ON'`)。
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --slow-query-log=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # MinIO 对象存储 —— 用户上传的 PDF 文件本体存放在这里
  # MySQL 只存元数据(object_key/size/sha256/uploaded_at),文件不入库
  # 兼容 S3 API,以后真要切阿里云 OSS / 腾讯 COS 只换 endpoint + credentials
  minio:
    image: minio/minio:latest
    container_name: scholar_minio
    restart: unless-stopped
    logging: *default-logging
    # 仅容器内部访问 API(9000);9001 是 web 控制台,不暴露主机(需要时再开)
    expose:
      - "9000"
      - "9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scholarminiopass}
    volumes:
      - ./data/minio:/data
      - /etc/localtime:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      # MinIO 自带的就绪探针 —— 等服务起来 + 至少一块盘就绪
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  # Redis cache service
  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    # Redis不暴露端口到主机,仅容器内部访问
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
      - /etc/localtime:/etc/localtime:ro
    # AOF: appendfsync everysec 显式声明（每秒 fsync，性能/持久化平衡的常规选择）
    # slowlog: 记录 >10ms 的命令，最多保留 256 条，用于排查热点 key 与慢命令
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --slowlog-log-slower-than 10000
      --slowlog-max-len 256
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # Redis(correctness 键专用,noeviction)—— 可选。
  # 吊销标记 / 每日配额 / SEO 推送队列等不能被 LRU 静默逐出的键放这里(主 Redis 是 allkeys-lru,
  # 内存打满会逐出任意键 → 吊销复活 / 配额清零)。启用方式:在 .env 设
  #   REDIS_PERSIST_HOST=scholar_redis_persist
  # backend 未设该 env 时这些键回落主 Redis(行为同今天),本容器闲置无害。
  # maxmemory-policy noeviction:写满即返回 OOM 错误而非逐出 —— correctness 键宁可写失败也不静默丢。
  redis-persist:
    image: redis:7-alpine
    container_name: scholar_redis_persist
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis-persist:/data
      - /etc/localtime:/etc/localtime:ro
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # 数据库迁移服务 - 每次启动按顺序执行 migrations/ 下的 SQL 文件
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      # 给 run-migrations.sh 用,首次启动幂等创建 umami 库并授权 scholar_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - ./docker/mysql/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts:/app/scripts:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/run-migrations.sh
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-scholar_pass}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SERVER_PORT: 8080
      # gin 运行模式: 默认 release(去掉 debug 路由噪声 + 每请求 debug 开销)。本机调试路由时
      # 在 .env 里设 GIN_MODE=debug 覆盖。不设而落 debug 是性能审计 be-http 的一个点。
      GIN_MODE: ${GIN_MODE:-release}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-adminadmin}
      FRONTEND_USER_URL: http://frontend-user:80
      # 测试支付:开后「账户资产」出现"测试支付"按钮, 下单后一键完成履约(无网关)。生产务必 false。
      PAYMENT_TEST_ENABLED: ${PAYMENT_TEST_ENABLED:-false}
      # 站点 / 第三方服务地址 —— 来源是 .env 的 SITE_URL 等单一变量,这里 fan-out 给 backend
      SEO_BASE_URL: ${SITE_URL:-https://www.scholay.com}
      SITE_NAME: ${SITE_NAME:-Scholay}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@scholay.com}
      # 主动 SEO 提交(详见 .env 注释段)
      SEO_SUBMIT_ENABLED: ${SEO_SUBMIT_ENABLED:-false}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BAIDU_PUSH_ENABLED: ${BAIDU_PUSH_ENABLED:-false}
      BAIDU_PUSH_TOKEN: ${BAIDU_PUSH_TOKEN:-}
      BAIDU_PUSH_SITE: ${BAIDU_PUSH_SITE:-}
      BAIDU_PUSH_DAILY_QUOTA: ${BAIDU_PUSH_DAILY_QUOTA:-1000}
      SEO_PUSH_WORKER_INTERVAL_SECONDS: ${SEO_PUSH_WORKER_INTERVAL_SECONDS:-300}
      SEO_PUSH_BATCH_SIZE: ${SEO_PUSH_BATCH_SIZE:-100}
      # MinIO 对象存储(用户上传 PDF) —— endpoint 用容器名 minio:9000
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scholarminiopass}
      MINIO_BUCKET_PAPER_PDFS: ${MINIO_BUCKET_PAPER_PDFS:-scholar-paper-pdfs}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # CORS —— fan-out 自 .env(默认 * 允许任意 origin,生产请改具体域名列表)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # ─── Umami HTTP API 接入 ───
      # backend internal/umami 通过 umami:3000 拉取统计,admin /analytics 自渲染图表。
      # 内网 URL + 默认 admin/umami 都写死在 client.go 里,这里只需告诉 backend WebsiteID。
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # AI Agent 桥接 —— backend POST agent /api/providers 必须带这个 Bearer
      # 与 agent 容器的 ANTHROPIC_API_KEY 同源 (AGENT_INTERNAL_TOKEN)。
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://scholar_agent:3456}
      AGENT_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      # C14 审批轴 **dev/测试** 开关: =1 时 claw 切 passthrough(permission_request 透传前端人审,
      # 绕过后端自动裁决)。默认空 = auto,行为与改造前一致。
      # ⚠️ docker-compose.prod.yml **故意不含此项**(生产恒 auto);仅本地保留以便测 passthrough/未来 HITL。
      CLAW_PERMISSION_PASSTHROUGH: ${CLAW_PERMISSION_PASSTHROUGH:-}
      # 智能审稿: backend 按 slug 读审稿人 skill 的「评分人格」段注入评分轮 (见 peerreview)。
      # 只读挂载与 agent 同一份 committed skills 目录 (单一真相源)。
      PEERREVIEW_SKILLS_DIR: ${PEERREVIEW_SKILLS_DIR:-/app/reviewer-skills}
      # Prism 会话经 --add-dir 加载写作 skill 的目录(agent 容器内 <此处>/.claude/skills)。
      PRISM_SKILL_ADDDIR: ${PRISM_SKILL_ADDDIR:-/prism-add}
      # Prism 编译任务共享目录(与 scholar_prism_tex 同卷;后端写任务、watcher 编译回写)
      PRISM_WORK_DIR: ${PRISM_WORK_DIR:-/data/prism-work}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 审稿人 skill 库 (reviewer-roster + rv-*): backend 只读, 按 slug 读 SCORING_PERSONA 段。
      # 这些 skill 已从共享的 skills/ 移到 reviewer-skills/ (claw 看不到, 仅 peerreview 方法论会话经 --add-dir 装)。
      - ./agent/data/claude/reviewer-skills:/app/reviewer-skills:ro
      # Prism 编译任务共享卷:后端写「任务目录+.request」,scholar_prism_tex watcher 轮询编译回写 PDF/log。
      - ./data/prism-work:/data/prism-work
    # Backend不暴露端口,通过Nginx访问
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network
      # backend 同时在 scholar-agent-net 上, 才能解析/调用 scholar_agent:3456
      # (CreateSession / ServerSideChat / WS 推送)。注意是单向: agent 侧只看得到 backend,
      # 看不到 mysql/redis/minio —— 即便 agent 被攻陷也够不到数据面。
      - scholar-agent-net

  # AI agent 服务 (Bun + TypeScript,源在 agent/)
  # 通用 Anthropic-format agent,作为内网服务被 backend 调用。
  # 模型/端点配置最终走 DB,backend 启动后 POST 到 /api/providers 热更新;
  # 这里 env_file 仅作 bootstrap (容器冷启动到 backend 推送之间的兜底)。
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: scholar_agent
    restart: unless-stopped
    depends_on:
      - egress-proxy
    logging: *default-logging
    env_file:
      - ./agent/.env
    environment:
      <<: *tz-env
      # 强制覆盖 agent/.env 里的 ANTHROPIC_API_KEY (内网 Bearer 鉴权 token)
      # 必须与 backend 的 AGENT_AUTH_TOKEN 同值,否则 backend push 配置会 401。
      ANTHROPIC_API_KEY: ${AGENT_INTERNAL_TOKEN:-}
      # agent → backend 内网回调地址(上报「带外」token 用量,如会话标题生成)。
      # NO_PROXY 已含 scholar_backend → 直连内网,不经 egress 代理。
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://scholar_backend:8080}
      # 可选: 自定义 CA 证书路径 (代理 / 内网 mTLS / 自签 CDN 场景)。
      # Bun / Node fetch 会把这个文件合并进 trust store, 解决 Clash / mihomo
      # fake-ip 模式或企业代理签证书时的 "unknown certificate verification error"。
      # 用法: 在 .env 设置 EXTRA_CA_CERTS=/path/to/proxy-ca.pem,
      # 然后取消注释下方 volumes 里的 EXTRA_CA_CERTS 挂载行。
      NODE_EXTRA_CA_CERTS: ${EXTRA_CA_CERTS_TARGET:-}
      # 出网经 egress-proxy —— scholar-agent-net 是 internal(无 NAT),agent 只能经代理出公网。
      # 默认 open 放行一切外部 HTTPS;agent 自带 proxy 支持(src/utils/proxy.ts,Anthropic SDK + undici 都吃)。
      HTTPS_PROXY: ${AGENT_HTTPS_PROXY:-http://scholar_egress_proxy:3128}
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-http://scholar_egress_proxy:3128}
      NO_PROXY: ${AGENT_NO_PROXY:-localhost,127.0.0.1,scholar_backend,backend,scholar_agent}
    expose:
      - "3456"
    volumes:
      # 会话/记忆持久化 (~/.claude 在容器内是 /home/bun/.claude)
      - ./data/agent:/home/bun/.claude
      # committed 的**共享** skill 库 (paper-review/journal-fit/citation-audit) 叠挂到 .claude/skills,
      # 所有会话(含 claw)可见。否则 agent 只挂 gitignored 的 data/agent, 这些 skill 永远加载不到。
      - ./agent/data/claude/skills:/home/bun/.claude/skills:ro
      # 审稿人 skill (reviewer-roster + rv-*) 放在独立目录, **不进**全局 .claude/skills;
      # 只有 peerreview 方法论会话经 --add-dir /peerreview-add 加载 <此处>/.claude/skills → claw 看不到。
      - ./agent/data/claude/reviewer-skills:/peerreview-add/.claude/skills:ro
      # 智能写作 skill (prism-latex-format / prism-academic-writing / prism-discipline-conventions):
      # 同样独立目录, 仅 prism 会话经 --add-dir /prism-add 加载 → claw/审稿看不到。
      - ./agent/data/claude/prism-skills:/prism-add/.claude/skills:ro
      # 会话工作目录 (cwd + 上传文件) 持久化 —— 与 docker-compose.prod.yml 对齐(prod 早已挂)。
      # 否则重建容器会清空 /home/bun/sessions/<id>,旧会话续聊报 "Working directory does not exist";
      # Prism agent-native 模式下该目录是「每项目工作副本」,更须持久。属主由镜像 entrypoint chown 自愈。
      - ./data/agent-sessions:/home/bun/sessions
      - /etc/localtime:/etc/localtime:ro
      # 可选: 把 host 上的代理 CA pem 挂进容器, 配合上面的 NODE_EXTRA_CA_CERTS env
      # - ${EXTRA_CA_CERTS_HOST:-./agent/extra-ca.pem.placeholder}:/certs/extra-ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3456/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 安全加固 (Scholay): agent 会跑模型生成的任务, 即便 P0 已禁所有内建工具,
    # 仍做纵深防御 —— 万一某条路径绕过, 容器层也碰不到提权 / 起不了 fork 炸弹。
    cap_drop:
      - ALL                          # agent 不需要任何 Linux capability (非 root, 端口 >1024)
    security_opt:
      - no-new-privileges:true       # 禁止 setuid 提权
    deploy:
      resources:
        limits:
          memory: 1.5G               # agent 是资源大头: LLM 流式 + Bash 转换 (pandoc/python) + PDF 解析; 单会话实测峰值 ~765MiB, 提到 1.5G 给并发会话留头
          cpus: "2.0"                # CPU 上限, 防单个重任务 (大 PDF 解析 / 死循环) 拖垮整机
          pids: 512                  # 进程数上限, 挡 fork 炸弹 (Bash 转换会起 pandoc/python 子进程, 512 仍宽裕)
        reservations:
          memory: 256M
    networks:
      # 安全隔离: agent 只在 scholar-agent-net(internal,无 NAT)上,够不到 mysql/redis/minio/umami;
      # 出公网只能经 egress-proxy(下方),统一记日志、可随 EGRESS_FILTER_MODE 收紧。
      - scholar-agent-net

  # agent 出公网的唯一出口:tinyproxy 代理(源在 egress/)。
  # 默认 open(放行一切外部 HTTPS,经代理记日志);设 EGRESS_FILTER_MODE=allowlist 收紧到 egress/filter 域名。
  # 内网由网络拓扑(proxy 不在 scholar-network)+ ConnectPort 443 挡住。
  egress-proxy:
    build:
      context: ./egress
      dockerfile: Dockerfile
    container_name: scholar_egress_proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      EGRESS_FILTER_MODE: ${EGRESS_FILTER_MODE:-open}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - scholar-agent-net
      - egress-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

  # Scholay Prism LaTeX 编译沙箱 (源在 prism_tex/)。
  # 与后端只经共享卷 ./data/prism-work 通信(watcher 轮询任务),故 network_mode: none 彻底断网。
  # 纵深防御: 无 cap / 无网络 / 只读 rootfs / no-new-privileges / pids·mem·cpu 限额 + 编译超时。
  prism-tex:
    build:
      context: ./prism_tex
      dockerfile: Dockerfile
    container_name: scholar_prism_tex
    # 与 backend(appuser uid 1001)同 uid 跑,才能写回共享卷里 backend(1001)建的编译任务目录。
    user: "1001:1001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      COMPILE_TIMEOUT: ${PRISM_COMPILE_TIMEOUT:-60}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/prism-work:/work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 30 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 用户前端 (Vite + React 19,源在 frontend-user/)
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        # 站点配置 build-time 注入到 Vite bundle (运行期不能变)
        VITE_SITE_URL: ${SITE_URL:-https://www.scholay.com}
        VITE_SITE_NAME: ${SITE_NAME:-Scholay}
        # 临时:智能写作「即将推出」门(读 .env 的 PRISM_COMING_SOON,默认 true)。true=盖蒙层。
        VITE_PRISM_COMING_SOON: ${PRISM_COMING_SOON:-true}
        # umami tracker 已改为运行时 fetch /api/v1/public/umami-config 拿 website_id,
        # 不需要 build-time 注入。换 umami DB / 重建 website 都无需 rebuild 前端。
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 发版灰度:持久化 hash 分包目录,旧版本 chunk 跨重建保留(默认 7 天,见
      # docker-entrypoint.d/40-sync-site.sh)→ 老标签页发版后跳转不再「页面加载失败」。
      - ./data/frontend-assets:/usr/share/nginx/html/assets
    expose:
      - "80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # ─── Umami 分析平台 ─────────────────────────────────────────────────
  # 单容器接入:
  #   - 镜像换 mysql-latest,DATABASE_URL 指 scholar_mysql 的 `umami` 库
  #     (该库 + 用户权限由 docker/mysql/initdb.d/01-umami-db.sql 首次启动时创建)
  #   - 不再暴露给主机:tracker (script + api/send) 由 nginx 反代,
  #     管理 UI 不再对外 —— admin /analytics 改为 backend HTTP API 自渲染图表
  #   - APP_SECRET 是 umami 容器自己签 token 用的,改值会让前端 tracker 老 hash 失效
  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: scholar_umami
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DATABASE_TYPE: mysql
      # connection_limit=5 显式限住 Prisma 连接池: 不设的话 Prisma 默认 num_cpus*2+1(8 核=17),
      # 与 backend 池(90)合计可能逼近/超过 MySQL max_connections=100, 触发 "Too many connections"。
      # umami 写入量很低, 5 条足够。性能审计 infra。
      DATABASE_URL: mysql://${MYSQL_USER:-scholar_user}:${MYSQL_PASSWORD:-scholar_pass}@mysql:3306/umami?connection_limit=5
      APP_SECRET: ${UMAMI_APP_SECRET:-change-this-umami-secret-in-production}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script
    volumes:
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      # 注:Umami v3 没有 /api/heartbeat,/login 永远 200,作 readiness 探针够用
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  nginx:
    image: nginx:alpine
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    ports:
      # 主入口 (含 /admin 路径)。umami UI / tracker 都通过这个端口的反代,不另开端口。
      - "${HTTP_PORT:-5411}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
      - frontend-user
      - umami
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge
  # 安全隔离: backend↔agent↔egress-proxy 内部网,internal=无 NAT —— agent 出公网只能经 egress-proxy。
  scholar-agent-net:
    driver: bridge
    internal: true
  # 只有 egress-proxy 在这张网上,它是唯一能 NAT 出公网的容器。
  egress-net:
    driver: bridge
