# 用户端配置 - 端口 80
server {
    listen 80;
    server_name _;

    # 访问日志
    access_log /var/log/nginx/user_access.log;
    error_log /var/log/nginx/user_error.log;

    # API请求代理到后端
    location /api/ {
        proxy_pass http://scholar_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://scholar_backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 静态资源缓存配置 (图片、字体、CSS、JS)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 启用浏览器缓存 - 静态资源缓存1年
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;

        # 压缩传输
        gzip on;
        gzip_vary on;
        gzip_types image/svg+xml image/x-icon text/css application/javascript;
    }

    # 前端HTML文件 - 不缓存以便更新
    location / {
        proxy_pass http://scholar_frontend_user:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # HTML不缓存,但允许协商缓存
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }
}
