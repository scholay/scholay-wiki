# =============================================================================
# 主入口 — 容器内部监听 80,docker-compose 映射到 ${HTTP_PORT:-5411}。
#
# 路径职责:
#   /api/*                  → backend
#   /api/v1/ws              → backend WebSocket
#   /umami-embed/script.js  → umami tracker (公开)
#   /umami-embed/api/send   → umami tracker 事件上报 (公开)
#   /uploads/*              → backend (用户上传 PDF / 图)
#   /health, sitemap, robots → backend
#   其他                    → frontend-user SPA (Vite + React 19)
# =============================================================================

server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 走 docker stdout/stderr → 受 x-default-logging json-file 10m×7≈70MB 上限管。
    # 之前写 /var/log/nginx/user_*.log 是容器内真实文件, 无 rotation, 长期会撑爆容器盘。
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # WebSocket (站内信 / 通知)
    location /api/v1/ws {
        proxy_pass http://backend_upstream/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering       off;
    }

    # 智能搜索 / 智能写作(Prism) WebSocket 桥接 —— backend 透传到 scholar_agent /ws/{sessionId}。
    # 与 /api/v1/ws 同一档读写超时 (24h),前端 token 走 query 参数,backend 自行校验。
    # Prism 的 agent 做文件编辑,单次工具执行可能 >60s 无帧,必须长超时(否则会被通用 /api 的 60s 掐断)。
    location ~ ^/api/v1/user/(smart-search|prism)/ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering       off;
    }

    # SSE 流式端点 (审稿 reviewer/chief 流式、Cover Letter / meta 抽取、翻译流等,路径以 /stream 结尾)。
    # 必须【长超时 + 关 buffering】,否则:
    #   ① proxy_read_timeout 60s 会在 agent 思考 / 用工具的静默期把流掐断
    #      (生产实测: GET .../peer-review/submissions/1/stream 报 upstream timed out)
    #   ② proxy_buffering on (默认) 会把 SSE 增量攒着不实时下发 → 前端"一口气出"而非逐字流。
    # regex location 优先级高于下面的 /api/ 前缀,所以这些路径会命中这里。
    # proxy_pass 不带 URI 部分 (正则 location 的硬性要求),原样透传完整路径给 backend。
    location ~ ^/api/v1/.+/stream$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # SSE 关键三连
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
        # 跟 backend APITimeoutMiddleware 的 SSE 15min 对齐,覆盖 agent 静默期
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # 分析 API —— 单独限流
    location ~ ^/api/v1/(analysis|public/usage-log) {
        limit_req zone=analysis_limit burst=30 nodelay;
        add_header X-RateLimit-Limit "5 requests per second" always;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 通用 API
    location /api/ {
        limit_req zone=ip_limit burst=50 nodelay;
        add_header X-RateLimit-Limit "10 requests per second" always;
        # nginx 语义: 本 location 一旦定义了任何 add_header, 就【不再继承】http 级的安全头 ——
        # 必须在这里重新声明, 否则所有 /api 响应丢掉 nosniff 等 (会放大同源 MIME 嗅探/SVG XSS)。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =========================================================================
    # Umami tracker —— 仅公开 tracker 端点, 主站任何页面里 <script src=
    # "/umami-embed/script.js"> 都能加载, 事件上报到 /umami-embed/api/send。
    #
    # umami 管理面板不在这里 —— admin /analytics 改为 backend HTTP API 自渲染图表。
    # upstream umami_upstream 在 nginx.conf 全局定义,复用同一条 keepalive。
    # =========================================================================
    location = /umami-embed/script.js {
        proxy_pass http://umami_upstream/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /umami-embed/api/send {
        proxy_pass http://umami_upstream/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 后端上传文件 / 图片 (强缓存 30 天)
    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 动态 sitemap / robots.txt —— 全部走后端生成 (Redis 版本号自管,不在 nginx 缓存)
    location ~ ^/(sitemap[a-zA-Z0-9_-]*\.xml|robots\.txt)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types application/xml text/xml text/plain;
    }

    # 静态资源 — frontend-user 容器内 nginx 已自带 1y immutable Cache-Control,
    # 这里加 nginx 层缓存提升 cold-start hit rate。
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js|mjs|wasm)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 入口 —— 直接交给 frontend-user 容器 (Vite build 后,内部 nginx 处理 try_files
    # SPA fallback;SEO 走 react-helmet 客户端注入,不依赖 backend SSR)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
