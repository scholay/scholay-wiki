# =============================================================================
# 主入口 — 容器内部监听 80,docker-compose 映射到 ${HTTP_PORT:-5411}。
#
# 路径职责:
#   /api/*                  → backend
#   /api/v1/ws              → backend WebSocket
#   /umami-embed/script.js  → umami tracker (公开)
#   /umami-embed/api/send   → umami tracker 事件上报 (公开)
#   /uploads/*              → backend (用户上传 PDF / 图)
#   /health, sitemap, robots → backend
#   其他                    → frontend-user SPA (Vite + React 19)
# =============================================================================

server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    access_log /var/log/nginx/user_access.log;
    error_log  /var/log/nginx/user_error.log;

    # WebSocket (站内信 / 通知)
    location /api/v1/ws {
        proxy_pass http://backend_upstream/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering       off;
    }

    # AI 流式接口 (SSE) —— buffering 必须关
    location ~ ^/api/v1/user/conversations/[0-9]+/(messages/[a-zA-Z0-9-]+/advanced-search|continue|chat/stream) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # peer-review V2 SSE
    location ~ ^/api/v1/user/peer-review2/conversations/[0-9]+/turns/[a-zA-Z0-9-]+/stream {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # 分析 API —— 单独限流
    location ~ ^/api/v1/(analysis|public/usage-log) {
        limit_req zone=analysis_limit burst=30 nodelay;
        add_header X-RateLimit-Limit "5 requests per second" always;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 通用 API
    location /api/ {
        limit_req zone=ip_limit burst=50 nodelay;
        add_header X-RateLimit-Limit "10 requests per second" always;

        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =========================================================================
    # Umami tracker —— 仅公开 tracker 端点, 主站任何页面里 <script src=
    # "/umami-embed/script.js"> 都能加载, 事件上报到 /umami-embed/api/send。
    #
    # umami 管理面板不在这里 —— admin /analytics 改为 backend HTTP API 自渲染图表。
    # upstream umami_upstream 在 nginx.conf 全局定义,复用同一条 keepalive。
    # =========================================================================
    location = /umami-embed/script.js {
        proxy_pass http://umami_upstream/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /umami-embed/api/send {
        proxy_pass http://umami_upstream/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 后端上传文件 / 图片 (强缓存 30 天)
    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 动态 sitemap / robots.txt —— 全部走后端生成 (Redis 版本号自管,不在 nginx 缓存)
    location ~ ^/(sitemap[a-zA-Z0-9_-]*\.xml|robots\.txt)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types application/xml text/xml text/plain;
    }

    # 静态资源 — frontend-user 容器内 nginx 已自带 1y immutable Cache-Control,
    # 这里加 nginx 层缓存提升 cold-start hit rate。
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js|mjs|wasm)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA 入口 —— 直接交给 frontend-user 容器 (Vite build 后,内部 nginx 处理 try_files
    # SPA fallback;SEO 走 react-helmet 客户端注入,不依赖 backend SSR)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
