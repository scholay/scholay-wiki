# 用户端配置 - 端口 80
server {
    listen 80;
    server_name _;

    # 提高性能：启用 sendfile 和 TCP 优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # 访问日志
    access_log /var/log/nginx/user_access.log;
    error_log /var/log/nginx/user_error.log;

    # 预渲染相关变量
    # 检测是否为搜索引擎爬虫（用于预渲染）
    set $prerender 0;
    if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|W3C_Validator|whatsapp|redditbot|applebot|semrushbot|screaming frog") {
        set $prerender 1;
    }
    # 如果请求的是静态资源，不走预渲染
    if ($uri ~* "\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot|bcmap)$") {
        set $prerender 0;
    }
    # 如果是 API 请求，不走预渲染
    if ($uri ~* "^/api/") {
        set $prerender 0;
    }

    # WebSocket 连接 - 实时消息推送
    location /api/v1/ws {
        proxy_pass http://scholar_backend:8080/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时设置（24小时）
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # 分析 API - 单独限流（防止分析密集型操作过载）
    location ~ ^/api/v1/(analysis|public/usage-log) {
        # 限流：同一 IP 每秒 5 个请求，允许突发 30 个
        limit_req zone=analysis_limit burst=30 nodelay;
        
        # 添加限流响应头（方便调试）
        add_header X-RateLimit-Limit "5 requests per second" always;
        
        proxy_pass http://scholar_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API请求代理到后端（全局 IP 限流）
    location /api/ {
        # 限流：同一 IP 每秒 10 个请求，允许突发 50 个
        limit_req zone=ip_limit burst=50 nodelay;
        
        # 添加限流响应头（方便调试）
        add_header X-RateLimit-Limit "10 requests per second" always;
        
        proxy_pass http://scholar_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;

        # 超时设置（普通API请求）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 智能分析和对话流式API - 需要更长的超时时间
    location ~ ^/api/v1/user/conversations/[0-9]+/(messages/[a-zA-Z0-9-]+/advanced-search|continue|chat/stream) {
        proxy_pass http://scholar_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE 流式响应设置
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 流式请求的超时设置（10分钟）
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://scholar_backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 上传文件代理到后端
    location /uploads/ {
        proxy_pass http://scholar_backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 图片缓存设置
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 静态资源 - 启用 Nginx 本地缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 启用 Nginx 本地缓存
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        # 删除所有上游的 Cache-Control 头
        proxy_hide_header Cache-Control;

        # 重新设置正确的缓存头
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # 启用代理缓存和连接复用
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # 压缩传输
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types image/svg+xml image/x-icon text/css application/javascript application/json;
    }

    # 动态 sitemap - 路由到后端生成（包含热门论文页面）
    location ~ ^/sitemap-(papers|index)\.xml$ {
        proxy_pass http://scholar_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 缓存1小时
        proxy_cache api_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 静态资源（非JS/CSS/图片等的其他静态文件）继续从前端容器获取
    location ~* \.(html|htm|json|txt|xml|webmanifest)$ {
        # 这些请求应该走后端的 SSR 注入（除了特定的静态文件）
        # 但是 manifest.json, robots.txt 等应该直接从前端容器获取
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 前端HTML页面 - 路由到后端进行 SSR 代码片段注入
    # 这使得代码片段在网页源码中可见（用于SEO和第三方平台验证）
    location / {
        proxy_pass http://scholar_backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 删除所有上游的 Cache-Control 头
        proxy_hide_header Cache-Control;

        # 重新设置正确的缓存头（HTML 不缓存）
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
