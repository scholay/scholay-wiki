# =============================================================================
# 主入口 — 容器内部监听 80,docker-compose 映射到 ${HTTP_PORT:-5411}。
#
# 路径职责:
#   /api/*                  → backend
#   /api/v1/ws              → backend WebSocket
#   /umami-embed/script.js  → umami tracker (公开)
#   /umami-embed/api/send   → umami tracker 事件上报 (公开)
#   /uploads/*              → backend (用户上传 PDF / 图)
#   /health, sitemap, robots → backend
#   其他                    → frontend-user SPA (Vite + React 19)
# =============================================================================

server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # 走 docker stdout/stderr → 受 x-default-logging json-file 10m×7≈70MB 上限管。
    # 之前写 /var/log/nginx/user_*.log 是容器内真实文件, 无 rotation, 长期会撑爆容器盘。
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # WebSocket (站内信 / 通知)
    location /api/v1/ws {
        proxy_pass http://backend_upstream/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering       off;
    }

    # 智能搜索 / 智能写作(Prism) / 智能助手(claw) WebSocket 桥接 —— backend 透传到 scholar_agent /ws/{sessionId}。
    # 与 /api/v1/ws 同一档读写超时 (24h),前端 token 走 query 参数,backend 自行校验。
    # agent 做文件编辑/长工具执行,单次可能 >60s 无帧,必须长超时(否则会被通用 /api 的 60s 掐断)。
    # claw(智能助手)此前漏在本正则外 → 落通用 /api 的 60s 被掐,与 prism/smart-search 不一致(性能审计 P0)。
    location ~ ^/api/v1/user/(smart-search|prism|claw)/ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering       off;
    }

    # SSE 流式端点 (审稿 reviewer/chief 流式、Cover Letter / meta 抽取、翻译流等,路径以 /stream 结尾;
    # 另含库内 PDF 上传解析 .../upload-and-resolve —— 它也是 SSE, 但上传到 MinIO + pdf 解析阶段会
    # 静默 ~80s, 落到下面通用 /api/ 的 60s proxy_read_timeout 会被掐断 → 大 PDF 的流提前死。性能审计 infra)。
    # 必须【长超时 + 关 buffering】,否则:
    #   ① proxy_read_timeout 60s 会在 agent 思考 / 用工具 / 上传解析的静默期把流掐断
    #      (生产实测: GET .../peer-review/submissions/1/stream 报 upstream timed out)
    #   ② proxy_buffering on (默认) 会把 SSE 增量攒着不实时下发 → 前端"一口气出"而非逐字流。
    # regex location 优先级高于下面的 /api/ 前缀,所以这些路径会命中这里。
    # proxy_pass 不带 URI 部分 (正则 location 的硬性要求),原样透传完整路径给 backend。
    location ~ ^/api/v1/.+/(stream|upload-and-resolve|export-pptx)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # SSE 关键三连
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
        # 跟 backend APITimeoutMiddleware 的 SSE 15min 对齐,覆盖 agent 静默期
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # 分析 API —— 单独限流
    location ~ ^/api/v1/(analysis|public/usage-log) {
        limit_req zone=analysis_limit burst=30 nodelay;
        add_header X-RateLimit-Limit "5 requests per second" always;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 内网回调端点 /api/v1/internal/* —— 只允许容器内网(scholar_agent → scholar_backend)直连,
    # 公网一律 404。^~ 前缀优先级高于下面的 /api/,确保拦在转发前。后端另有 Bearer 中间件(纵深防御)。
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # 情报 webhook(上游 Minicod server-to-server 推送)—— 验签即闸(HMAC-SHA256),
    # 不该被「浏览器向」的 10r/s IP 限流卡住(初始回填 / 批量热度会突发,逐条投递)。
    # exact-match 优先级高于下面 /api/ 前缀;给宽松 burst,真实滥用由后端验签 + gin IP 限流兜底。
    location = /api/v1/webhook/minicod-news {
        limit_req zone=ip_limit burst=200 nodelay;
        proxy_pass http://backend_upstream/api/v1/webhook/minicod-news;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 通用 API
    location /api/ {
        limit_req zone=ip_limit burst=50 nodelay;
        add_header X-RateLimit-Limit "10 requests per second" always;
        # nginx 语义: 本 location 一旦定义了任何 add_header, 就【不再继承】http 级的安全头 ——
        # 必须在这里重新声明, 否则所有 /api 响应丢掉 nosniff 等 (会放大同源 MIME 嗅探/SVG XSS)。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host 保留端口($host 会丢 :5411)—— skill 市场按 Host 生成对外分享/下载/安装命令的
        #   绝对 URL,丢端口会让默认部署下复制出的 curl 命令指向 :80 而装不上(审计 #3)。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 优先透传外层(TLS 终结/CDN)传入的 X-Forwarded-Proto,缺失才用本层 $scheme(恒 http)——
        #   否则 HTTPS 生产也生成 http:// 分享链触发混合内容拦截(审计 #13)。$fwd_proto 见 nginx.conf map。
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # =========================================================================
    # Umami tracker —— 仅公开 tracker 端点, 主站任何页面里 <script src=
    # "/umami-embed/script.js"> 都能加载, 事件上报到 /umami-embed/api/send。
    #
    # umami 管理面板不在这里 —— admin /analytics 改为 backend HTTP API 自渲染图表。
    # upstream umami_upstream 在 nginx.conf 全局定义,复用同一条 keepalive。
    # =========================================================================
    location = /umami-embed/script.js {
        proxy_pass http://umami_upstream/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /umami-embed/api/send {
        proxy_pass http://umami_upstream/api/send;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # =========================================================================
    # 情报封面图 同源代理 —— minicod 图床 CORP 破除。
    #
    # minicod 图床(Caddy)给 /uploads/* 打 `Cross-Origin-Resource-Policy: same-site`。
    # 本站 www.scholay.com 与 www.minicod.com 非 same-site → 浏览器直接拦掉跨站 <img>
    # → 封面裂图(server↔server 取图无此约束,故 curl 200 但浏览器加载失败)。
    # 这里把 /img-remote/minicod/<path> 反代到 https://www.minicod.com/uploads/<path>,
    # proxy_hide_header 掉那个 CORP 头,让图片以【本站同源】身份下发,浏览器就肯渲染了。
    # backend 下发 DTO 时已把 cover_image 的 minicod URL 改写成 /img-remote/minicod/…(见 news.proxifyImageURL)。
    #
    # ^~ 前缀:压过下面 `~* \.(png|…)$` 静态正则,避免这条被当成前端静态资源反代到 SPA。
    # 变量 proxy_pass + resolver:把 DNS 解析推迟到【请求时】,minicod 偶发解析失败只 502 单张图,
    #   不会像字面量 proxy_pass 那样在 nginx 启动时因解析不到就整站起不来。
    location ^~ /img-remote/minicod/ {
        resolver 127.0.0.11 ipv6=off valid=300s;   # Docker 内嵌 DNS
        resolver_timeout 5s;

        set $minicod_upstream https://www.minicod.com;
        rewrite ^/img-remote/minicod/(.*)$ /uploads/$1 break;
        proxy_pass $minicod_upstream;

        proxy_ssl_server_name on;                    # Caddy/S3 vhost 需要 SNI
        proxy_set_header Host www.minicod.com;
        proxy_set_header Referer https://www.minicod.com/;  # 防上游万一开防盗链
        # 不把本站 cookie / 鉴权头泄漏给第三方图床
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # 关键:剥掉上游的跨源限制头,同源下发
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        proxy_hide_header Set-Cookie;

        proxy_cache static_cache;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_key $uri;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/conf.d/security-headers.inc;  # 本 location 自带 add_header → 安全头不再继承,补回

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 后端上传文件 / 图片 (强缓存 30 天)
    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_key $uri;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/conf.d/security-headers.inc;  # 本 location 自带 add_header → 安全头不再继承,补回
    }

    # 动态 sitemap / robots.txt / IndexNow key 文件 —— 全部走后端生成 (Redis 版本号自管,不在 nginx 缓存)
    #
    # IndexNow(Bing/Yandex/…)校验站点归属靠反向抓 https://<host>/<key>.txt 拿到纯文本 key。
    # 后端 seosubmit.RegisterKeyFileRoute 已在 gin 上服务 /<key>.txt,但**必须让 nginx 把这个
    # 根级 .txt 转到后端**,否则会落到下面兜底的 `location /` → 前端 SPA(返回 index.html),
    # 校验拿到 HTML 而非 key → IndexNow 报 403 UserForbiddedToAccessSite。
    # 放宽到 [a-zA-Z0-9-]{8,128}\.txt(IndexNow key 合法字符集)即可 key-agnostic、免随 key 轮换改 nginx;
    # 后端只对真正的 key 路径返回 key、其它 .txt 返回 404,故放宽是安全的
    # (frontend-user/public 无任何根级 .txt;{8,128} 也不会误伤 ads.txt/sellers.txt 等短名)。
    # 注意:正则含 {8,128} 量词,必须整段加引号 —— 否则 nginx 配置解析器会把 `{` 当成 location 块的
    # 起始花括号,报 "pcre2_compile() failed: missing closing parenthesis"。
    location ~ "^/(sitemap[a-zA-Z0-9_-]*\.xml|robots\.txt|[a-zA-Z0-9-]{8,128}\.txt)$" {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types application/xml text/xml text/plain;
    }

    # 根级【不带内容 hash】的品牌资产 —— 短 TTL,必须排在下面那条静态正则【之前】
    # (nginx 正则 location 按出现顺序首个命中生效,写在后面永远轮不到)。
    #
    # 为什么外层也要写一遍:本 location 之下的静态块用 `proxy_hide_header Cache-Control`
    # 抹掉上游头后自己重打 1y immutable —— 只改 frontend-user/nginx.conf 会被外层原样覆盖回去。
    # 两层必须同时改,这里是主战场。背景见 frontend-user/nginx.conf 同名 location 的注释。
    location ~* ^/(favicon\.svg|og-image[a-z0-9-]*\.png|apple-touch-icon[a-z0-9-]*\.png|manifest\.webmanifest)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key $uri$is_args$args;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.inc;  # 本 location 自带 add_header → 安全头不再继承,补回
    }

    # 静态资源 — frontend-user 容器内 nginx 已自带 1y immutable Cache-Control,
    # 这里加 nginx 层缓存提升 cold-start hit rate。
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js|mjs|wasm)$ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_key $uri$is_args$args;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;  # 本 location 自带 add_header → 安全头不再继承,补回
    }

    # 实体页 + 内容页 SSR(SEO 恢复):对**爬虫**走 backend(注入 title/JSON-LD/noscript,
    # 百度等弱 JS 爬虫能看到真实元数据/正文),对普通用户走前端 SPA。
    # 覆盖:实体页 paper/author/journal/tools + 内容营销页 resources/blog/help/about/features/pricing
    #      + 搜索入口 search/journals(search、journals/search) + 合规页 privacy/terms/disclaimer。
    #   注:search/journals/privacy/terms/disclaimer 此前漏在白名单外,爬虫只拿到空 SPA 壳
    #       (已进 sitemap 却抓不到内容),2026-06 补入并配套后端 SSR inject。
    # `if ($is_crawler){return 418}` 是 nginx 认可的安全 if 用法(仅 return),经 error_page
    # 内部跳到 @ssr_backend,避开「if 内 proxy_pass」的 if-is-evil 陷阱。
    location ~ ^/(paper|author|journal|journals|tools|news|resources|blog|qa|help|about|features|pricing|search|privacy|terms|disclaimer)(/|$) {
        error_page 418 = @ssr_backend;
        recursive_error_pages on;
        if ($is_crawler) { return 418; }

        # 普通用户:前端 SPA(react-helmet 客户端 SEO)
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # 清 Connection 头,复用 upstream keepalive TCP(性能审计 #10)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 爬虫的实体页 → backend SSR(NoRoute → ServeIndexHTML 注入)。
    location @ssr_backend {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # 清 Connection 头,复用 upstream keepalive TCP(性能审计 #10)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # 首页(精确 /):对**爬虫**走 backend SSR —— 注入首页自指 canonical + 本页 OG/Twitter,
    # 消除「首页无 canonical、变体(尾斜杠/参数)未归一」。普通用户仍走前端 SPA。
    # exact match `= /` 优先级高于下面的前缀 `location /`,只命中根路径,不影响 SPA 子路由。
    location = / {
        error_page 418 = @ssr_backend;
        recursive_error_pages on;
        if ($is_crawler) { return 418; }

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";  # 清 Connection 头,复用 upstream keepalive TCP(性能审计 #10)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA 入口 —— 直接交给 frontend-user 容器 (Vite build 后,内部 nginx 处理 try_files
    # SPA fallback;SEO 走 react-helmet 客户端注入,不依赖 backend SSR)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # SPA HTML 文档:本 location 自带 Cache-Control → 不再继承 http 级安全头,必须补回,
        # 否则登录/充值页可被任意源 iframe 点击劫持(无 X-Frame-Options/nosniff)。
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
