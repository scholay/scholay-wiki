# 管理台兼容入口 - 端口 8001
# 管理端前端已合并到 frontend-user 中，默认入口重定向到 /admin。
server {
    listen 8001;
    server_name _;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    access_log /var/log/nginx/admin_access.log;
    error_log /var/log/nginx/admin_error.log;

    location = / {
        return 302 /admin;
    }

    location /api/ {
        proxy_pass http://scholar_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://scholar_backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /uploads/ {
        proxy_pass http://scholar_backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* \.wasm$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        default_type application/wasm;
        add_header Content-Type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.mjs$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        default_type application/javascript;
        add_header Content-Type "application/javascript" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types image/svg+xml image/x-icon text/css application/javascript application/json;
    }

    location = /version.json {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ~* \.(html|htm|json|txt|xml|webmanifest)$ {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://scholar_frontend_user:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
