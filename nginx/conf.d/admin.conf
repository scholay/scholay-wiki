# 管理台配置 - 端口 8001
server {
    listen 8001;
    server_name _;

    # 提高性能：启用 sendfile 和 TCP 优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;

    # 访问日志
    access_log /var/log/nginx/admin_access.log;
    error_log /var/log/nginx/admin_error.log;

    # API请求代理到后端
    location /api/ {
        proxy_pass http://scholar_backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location /health {
        proxy_pass http://scholar_backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 上传文件代理到后端
    location /uploads/ {
        proxy_pass http://scholar_backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 图片缓存设置
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 静态资源 - 强制设置缓存头（防止上游干扰）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|css|js)$ {
        proxy_pass http://scholar_frontend_admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 删除所有上游的 Cache-Control 头
        proxy_hide_header Cache-Control;

        # 重新设置正确的缓存头（静态资源缓存1年）
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # 启用代理缓存和连接复用
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # 压缩传输
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types image/svg+xml image/x-icon text/css application/javascript application/json;
    }

    # 前端HTML文件 - 强制设置缓存头（防止上游干扰）
    location / {
        proxy_pass http://scholar_frontend_admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 删除所有上游的 Cache-Control 头
        proxy_hide_header Cache-Control;

        # 重新设置正确的缓存头（HTML 不缓存）
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
