user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ============================================================================
    # 真实 IP 获取 - 从 X-Forwarded-For 或 X-Real-IP 获取客户端真实 IP
    # ============================================================================
    map $http_x_forwarded_for $real_client_ip {
        ~^(?<firstip>[0-9\.]+),?.*$ $firstip;  # 获取 X-Forwarded-For 第一个 IP
        default                      $remote_addr;
    }
    
    # 如果 X-Real-IP 存在，优先使用它
    map $http_x_real_ip $final_client_ip {
        ""      $real_client_ip;
        default $http_x_real_ip;
    }

    # ============================================================================
    # WebSocket 连接升级映射：仅当客户端真的请求 Upgrade 时才透传 Connection: upgrade
    # 普通请求传 Connection: ""，允许 keepalive 复用上游 TCP 连接
    # ============================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 对外协议:优先用外层(TLS 终结/CDN/LB)传入的 X-Forwarded-Proto,缺失才用本层 $scheme。
    # 本 nginx 只 listen 80 → $scheme 恒 http;若直接透传 $scheme,HTTPS 生产会把分享链/下载命令
    # 生成成 http://(混合内容拦截)。skill 市场按此生成对外绝对 URL(审计 #13)。
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # ============================================================================
    # IP 限流配置 - 基于真实客户端 IP
    # 普通 API: 每秒 10 个请求（每分钟 600 个）
    # 分析 API: 每秒 5 个请求（限制分析密集型操作）
    # ============================================================================
    limit_req_zone $final_client_ip zone=ip_limit:10m rate=10r/s;
    limit_req_zone $final_client_ip zone=analysis_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    # ============================================================================
    # 上游连接池：避免每次请求都向 backend / frontend 新建 TCP
    # 配合 location 中的 `proxy_http_version 1.1; proxy_set_header Connection "";`
    # ============================================================================
    upstream backend_upstream {
        server scholar_backend:8080;
        keepalive            64;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

    upstream frontend_upstream {
        server scholar_frontend_user:80;
        keepalive            32;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

    # 爬虫 UA 识别 —— 实体页(/paper /author /journal /tools)对爬虫走 backend SSR(注入
    # title/JSON-LD/noscript,百度等弱 JS 爬虫能看到真实元数据),对普通用户走前端 SPA(react-helmet
    # 客户端注入,backend 不必扛实体页的全部页面流量)。命中即 $is_crawler=1。
    map $http_user_agent $is_crawler {
        default                                  0;
        "~*(bot|crawler|spider|slurp|crawling)"  1;
        "~*(baiduspider|googlebot|bingbot|yandex|sogou|360spider|bytespider|yisouspider)" 1;
        "~*(duckduckbot|applebot|facebookexternalhit|twitterbot|linkedinbot|embedly|whatsapp|telegrambot)" 1;
        "~*(semrushbot|ahrefsbot|mj12bot|petalbot|dotbot)" 1;
        # GEO: AI 生成式引擎的实时取页类 UA(ChatGPT-User / Claude-User / Perplexity-User 等),
        # 不含 bot 子串,不会命中上面的通用规则,必须具名,否则它们走 SPA 拿到空首屏。
        # GPTBot/OAI-SearchBot/ClaudeBot/PerplexityBot 已被首行 bot 兜住,这里一并列出使意图清晰。
        # 命中即 is_crawler=1,走 backend SSR 拿真实元数据。
        "~*(gptbot|oai-searchbot|chatgpt-user|claudebot|claude-searchbot|claude-user|anthropic-ai|perplexitybot|perplexity-user|google-extended|youbot|amazonbot|meta-externalagent|cohere-ai|ccbot|diffbot|timpibot)" 1;
    }

    # Umami 上游 —— 仅给 v2.conf 的 /umami-embed/{script.js, api/send} 反代用,
    # admin /analytics 已改为 backend HTTP API 自渲染图表,不再反代 umami UI。
    upstream umami_upstream {
        server scholar_umami:3000;
        keepalive            32;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

    # 上传文件大小限制 (支持最大50MB，用于主稿件上传)
    client_max_body_size 50m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Proxy Cache Settings - 静态资源本地缓存
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:10m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    # 注:原 api_cache zone 已删除 —— 声明后零 location 引用(且鉴权 API 微缓存需 proxy_cache_bypass
    # $http_authorization 才安全,当前无此需求)。要加 API 微缓存时再连同 bypass 一起配。

    # Include virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
