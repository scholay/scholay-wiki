user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 把端到端与 upstream 各阶段耗时直接写入访问日志，便于区分
    # 客户端慢、Nginx 排队、建连慢和后端首包慢，避免下次只能靠现场复现。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent request_time=$request_time '
                      'upstream_addr="$upstream_addr" upstream_status="$upstream_status" '
                      'upstream_connect_time="$upstream_connect_time" '
                      'upstream_header_time="$upstream_header_time" '
                      'upstream_response_time="$upstream_response_time" '
                      'cache_status="$upstream_cache_status" request_id="$request_id" '
                      'upstream_request_id="$upstream_http_x_request_id" '
                      '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ============================================================================
    # 真实 IP 获取 - 从 X-Forwarded-For 或 X-Real-IP 获取客户端真实 IP
    # ============================================================================
    map $http_x_forwarded_for $real_client_ip {
        ~^(?<firstip>[0-9\.]+),?.*$ $firstip;  # 获取 X-Forwarded-For 第一个 IP
        default                      $remote_addr;
    }
    
    # 如果 X-Real-IP 存在，优先使用它
    map $http_x_real_ip $final_client_ip {
        ""      $real_client_ip;
        default $http_x_real_ip;
    }

    # ============================================================================
    # WebSocket 连接升级映射：仅当客户端真的请求 Upgrade 时才透传 Connection: upgrade
    # 普通请求传 Connection: ""，允许 keepalive 复用上游 TCP 连接
    # ============================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 对外协议:优先用外层(TLS 终结/CDN/LB)传入的 X-Forwarded-Proto,缺失才用本层 $scheme。
    # 本 nginx 只 listen 80 → $scheme 恒 http;若直接透传 $scheme,HTTPS 生产会把分享链/下载命令
    # 生成成 http://(混合内容拦截)。skill 市场按此生成对外绝对 URL(审计 #13)。
    map $http_x_forwarded_proto $fwd_proto {
        default $scheme;
        https   https;
        http    http;
    }

    # 静态资源缓存头按状态码分流(2026-08-12 审计):`add_header ... immutable always` 会让
    # 404/500 也带上 1 年 immutable —— 对 /images、/fonts 等无内容 hash 的命名空间,
    # 「引用先于部署」的用户会把一次 404 缓存整整一年且无法自愈。只有真 200 才给长缓存,
    # 其余(404/500/304 由浏览器自理)给 no-cache,让缺失资源部署后立即可取。
    map $status $static_cache_control {
        200     "public, max-age=31536000, immutable";
        default "no-cache";
    }

    # ============================================================================
    # 真实客户端 IP 还原(性能审计 P0:限流键防伪造)
    # 本 nginx 不直接暴露公网,只经 5411 由【宿主机 Caddy 反代】访问 → 连接源恒为 docker bridge 网关。
    # 旧限流键 $final_client_ip 取自客户端可伪造的 X-Real-IP / X-Forwarded-For 首段 → 每请求换个头
    # 即可绕过 10r/s 过载保护。改用 real_ip 模块:只信任来自 docker bridge 的转发头(子网未在 compose
    # 固定,故信任 Docker 默认私网段 172.16/12 + 本机),real_ip_recursive on 从右向左跳过受信代理,
    # 落到 Caddy 记录的真实客户端 IP → $remote_addr 变为不可伪造的真实 IP,作限流键。
    # ============================================================================
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ============================================================================
    # IP 限流配置 - 基于真实客户端 IP($remote_addr 经 real_ip 还原后不可伪造)
    # 普通 API: 每秒 10 个请求（每分钟 600 个）
    # 分析 API: 每秒 5 个请求（限制分析密集型操作）
    # ============================================================================
    limit_req_zone $remote_addr zone=ip_limit:10m rate=10r/s;
    limit_req_zone $remote_addr zone=analysis_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    # ============================================================================
    # 上游连接池：避免每次请求都向 backend / frontend 新建 TCP
    # 配合 location 中的 `proxy_http_version 1.1; proxy_set_header Connection "";`
    # ============================================================================
    upstream backend_upstream {
        server scholar_backend:8080;
        keepalive            64;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

    upstream frontend_upstream {
        server scholar_frontend_user:80;
        keepalive            32;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

	# 根路径的手机分流在 HTML/SPA 下载之前完成。规则与
    # frontend-user/src/shared/lib/device.ts 同口径：只识别确定的手机，pad/爬虫仍走桌面首页。
    map $http_user_agent $is_phone_client {
        default                                                   0;
        "~*(bot|spider|crawl|slurp|bingpreview|petalbot|yisou|google-inspectiontool|googleother)"  0;
        "~*(ipad|tablet|silk|playbook)"                          0;
        "~*(iphone|ipod|windows phone|mobi)"                    1;
    }

    # Meta 的 AI 语料爬虫拦截开关 —— robots.txt 已对 Meta-ExternalAgent 声明 Disallow: /
    # (见 backend/internal/seo/handler.go ServeRobotsTxt),但 robots 是**自愿协议**,
    # 这里是它的强制执行层:命中即 403,请求根本不进 backend。
    # 依据:生产 24h 实测 33,796 次实体页抓取(全站爬虫量第一)、零收录零引用零流量,
    # 却是 SSR on-miss 现拉 minicod 的最大单一来源。
    # 🔴 刻意只精确匹配这一个产品名,**绝不**写 ~*bot 之类的泛匹配 ——
    # 泛匹配会顺手打死 Googlebot / Baiduspider 等我们要的收录流量。
    map $http_user_agent $block_meta_bot {
        default                0;
        "~*Meta-ExternalAgent" 1;
    }

    # Umami 上游 —— 仅给 v2.conf 的 /umami-embed/{script.js, api/send} 反代用,
    # admin /analytics 已改为 backend HTTP API 自渲染图表,不再反代 umami UI。
    upstream umami_upstream {
        server scholar_umami:3000;
        keepalive            32;
        keepalive_requests   1000;
        keepalive_timeout    60s;
    }

    # 上传文件大小限制 (支持最大50MB，用于主稿件上传)
    client_max_body_size 50m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Proxy Cache Settings - 静态资源本地缓存
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:10m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    # 注:原 api_cache zone 已删除 —— 声明后零 location 引用(且鉴权 API 微缓存需 proxy_cache_bypass
    # $http_authorization 才安全,当前无此需求)。要加 API 微缓存时再连同 bypass 一起配。

    # Include virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
