user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ============================================================================
    # 真实 IP 获取 - 从 X-Forwarded-For 或 X-Real-IP 获取客户端真实 IP
    # ============================================================================
    map $http_x_forwarded_for $real_client_ip {
        ~^(?<firstip>[0-9\.]+),?.*$ $firstip;  # 获取 X-Forwarded-For 第一个 IP
        default                      $remote_addr;
    }
    
    # 如果 X-Real-IP 存在，优先使用它
    map $http_x_real_ip $final_client_ip {
        ""      $real_client_ip;
        default $http_x_real_ip;
    }

    # ============================================================================
    # IP 限流配置 - 基于真实客户端 IP
    # 普通 API: 每秒 10 个请求（每分钟 600 个）
    # 分析 API: 每秒 5 个请求（限制分析密集型操作）
    # ============================================================================
    limit_req_zone $final_client_ip zone=ip_limit:10m rate=10r/s;
    limit_req_zone $final_client_ip zone=analysis_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 上传文件大小限制 (支持最大50MB，用于主稿件上传)
    client_max_body_size 50m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Proxy Cache Settings - 静态资源本地缓存
    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:10m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    # Proxy Cache Settings - API响应缓存(短期)
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:10m
                     max_size=100m
                     inactive=1h
                     use_temp_path=off;

    # Include virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
