services:
  paper-reviewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: paper-reviewer:latest
    container_name: paper-reviewer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3456:3456"
    volumes:
      # 会话/记忆持久化 (~/.claude 在容器内是 /home/bun/.claude)
      - ./data/claude:/home/bun/.claude
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3456/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - paper-net

networks:
  paper-net:
    driver: bridge
