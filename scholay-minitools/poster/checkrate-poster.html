<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #05070f; }
  .poster {
    position: relative; width: 1080px; height: 1440px; overflow: hidden;
    background: #0b1020; color: #eef2ff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .aurora { position: absolute; inset: -15%; z-index: 0; filter: blur(70px) saturate(1.2); }
  .aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; display: block; }
  .b1 { width: 620px; height: 620px; top: -120px; left: -100px; background: radial-gradient(circle at 40% 40%, #7c6cff, transparent 62%); }
  .b2 { width: 560px; height: 560px; top: 380px; right: -160px; background: radial-gradient(circle at 60% 40%, #22d3ee, transparent 60%); }
  .b3 { width: 560px; height: 560px; bottom: -160px; left: 120px; background: radial-gradient(circle at 50% 50%, #f472b6, transparent 62%); opacity: .8; }
  .grain { position: absolute; inset: 0; z-index: 1; opacity: .05;
    background-image: radial-gradient(rgba(255,255,255,.9) .6px, transparent .6px); background-size: 3px 3px; }
  .wrap { position: relative; z-index: 2; padding: 76px 76px 60px; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .s { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
    background: linear-gradient(135deg, #7c6cff, #22d3ee); color: #fff; font-weight: 900; font-size: 30px;
    box-shadow: 0 10px 26px -8px #7c6cff; }
  .brand b { font-size: 27px; font-weight: 800; letter-spacing: .5px; }
  .brand b span { color: #aab3d6; font-weight: 600; }

  .eyebrow { margin-top: 62px; font-size: 30px; font-weight: 700; letter-spacing: 4px; color: #22d3ee; }
  h1 { margin-top: 20px; font-size: 96px; line-height: 1.1; font-weight: 850; letter-spacing: -1px; }
  h1 .g { background: linear-gradient(100deg, #22d3ee, #7c6cff 58%, #f0abfc);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { margin-top: 26px; font-size: 34px; color: #aab3d6; font-weight: 500; }

  .card { background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.12); border-radius: 34px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.8); }

  .gaugecard { margin-top: 46px; padding: 46px 40px 40px; display: flex; flex-direction: column; align-items: center; }
  .gauge { position: relative; width: 340px; height: 340px; }
  .gauge .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .gauge .big { font-size: 104px; font-weight: 850; letter-spacing: -3px; line-height: 1; }
  .gauge .lbl { font-size: 26px; color: #aab3d6; margin-top: 10px; }
  .legend { display: flex; gap: 12px; margin-top: 30px; }
  .lg { font-size: 26px; font-weight: 700; color: #6f79a3; border: 1px solid rgba(255,255,255,.1);
    padding: 9px 22px; border-radius: 999px; }
  .lg.on { color: #0b1020; border-color: transparent; background: #fb7185; }
  .gaugecard .hint { margin-top: 24px; font-size: 25px; color: #aab3d6; }
  .gaugecard .hint b { color: #fbbf24; font-weight: 800; }

  .pills { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pill { display: flex; align-items: center; gap: 16px; padding: 28px 30px; font-size: 32px; font-weight: 700;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.11); border-radius: 22px; }
  .pill .ic { width: 46px; height: 46px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 25px;
    background: linear-gradient(135deg, #7c6cff, #22d3ee); }

  .cta { margin-top: 40px; display: flex; align-items: center; gap: 32px; padding: 36px;
    background: linear-gradient(135deg, rgba(124,108,255,.24), rgba(34,211,238,.14));
    border: 1px solid rgba(124,108,255,.4); border-radius: 34px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.8); }
  .qr { width: 210px; height: 210px; flex: none; background: #fff; border-radius: 22px; padding: 16px;
    box-shadow: 0 14px 34px -12px rgba(0,0,0,.6); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .ctatext .l1 { font-size: 44px; font-weight: 850; }
  .ctatext .l2 { font-size: 28px; color: #cdd4f0; margin-top: 8px; }
  .ctatext .url { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 30px; font-weight: 800;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.14); padding: 12px 24px; border-radius: 999px; }
  .ctatext .url .go { color: #22d3ee; }

  .disc { margin-top: auto; padding-top: 30px; text-align: center; font-size: 22px; color: #6f79a3; }
</style>
