<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>查重红线速查 · 本硕博 / 期刊 / SCI + AIGC 率</title>
  <link rel="stylesheet" href="./shared/brand.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div class="app">
    <div class="brandbar">
      <span class="wordmark"><span class="dot">S</span><b>Scholay</b></span>
      <span class="tag">查重红线速查</span>
    </div>

    <div class="hero">
      <span class="eyebrow">毕业季 · 投稿季必备</span>
      <h1>你的论文<span class="hl">查重红线</span>是多少?</h1>
      <p>30+ 场景一键查 · 含 AIGC 率新标准 · 检测系统 / 降重全攻略</p>
    </div>

    <div class="card">
      <div class="card-title"><span class="num">1</span>选择你的场景</div>
      <div class="substep"><span class="sd">1</span><span>先选大类</span></div>
      <div class="seg" id="groupSeg"></div>
      <div class="substep step2"><span class="sd">2</span><span id="step2label">再选具体场景</span></div>
      <div class="seg" id="itemSeg"></div>
      <div class="pick-hint" id="pickHint">👆 点一个,查它的合格红线</div>
    </div>

    <div id="result" class="result"></div>

    <div class="card"><div class="card-title"><span class="num">2</span>检测系统对比</div>
      <div class="sec-sub">同一篇论文在不同系统分数差 5–8% 很正常。定稿务必用<b>学校 / 期刊指定系统</b>再查一次。</div>
      <div id="systems"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">3</span>AIGC / AI 率专题</div>
      <div id="aigc"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">4</span>降重 9 步清单</div>
      <div id="reduce"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">?</span>查重前必懂</div>
      <div class="facts" id="facts"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">Q</span>常见问题</div>
      <div id="faqs"></div>
    </div>

    <div class="disclaimer" id="disclaimer"></div>
    <div data-cta="查重难,不如写作时就<span class=&quot;hl&quot;>少踩雷</span>"></div>
    <div data-foot></div>
  </div>

  <script src="./shared/convert.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
