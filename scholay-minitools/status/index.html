<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>投稿状态词典 · EM/ScholarOne/MDPI/Frontiers 全解</title>
  <link rel="stylesheet" href="./shared/brand.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div class="app">
    <div class="brandbar">
      <span class="wordmark"><span class="dot">S</span><b>Scholay</b></span>
      <span class="tag">投稿状态词典</span>
    </div>

    <div class="hero">
      <span class="eyebrow">投稿等待焦虑缓解</span>
      <h1><span class="hl">Under Review</span> 到底在等什么?</h1>
      <p>13 个状态节点 · 9 大投稿系统对照 · 该不该催 + 话术模板</p>
    </div>

    <div class="card">
      <div class="card-title"><span class="num">1</span>你的稿件走到哪一步了?</div>
      <div class="pipe" id="pipe"></div>
    </div>

    <div id="result" class="result"></div>

    <div class="card"><div class="card-title"><span class="num">2</span>9 大投稿系统对照</div>
      <div class="sec-sub">措辞不同,流程一致。看懂任意一套即可推断另一套。</div>
      <div id="systems"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">3</span>决定信 7 种结果</div>
      <div id="decisions"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">4</span>该不该催 · 时间线判断</div>
      <div id="advice"></div>
      <div class="sec-h" style="margin-top:16px">📏 平均「首轮决定」周期基线</div>
      <div class="sec-sub" id="benchNote"></div>
      <div id="bench"></div>
      <div class="sec-h" style="margin-top:16px">🙏 催稿礼仪</div>
      <div id="etiquette"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">5</span>催稿 / 返修话术模板</div>
      <div class="seg tpl-tabs" id="tplTabs"></div>
      <textarea class="tpl-area selectable" id="tplArea" readonly></textarea>
      <div class="tpl-hint">长按文本 → 全选 → 复制(容器禁一键复制,需手动选中)</div>
    </div>

    <div class="card"><div class="card-title"><span class="num">Q</span>常见问题</div>
      <div id="faqs"></div>
    </div>

    <div class="disclaimer" id="disclaimer"></div>
    <div data-cta="等审稿的时间,不如让 <span class=&quot;hl&quot;>AI 先审一遍</span>"></div>
    <div data-foot></div>
  </div>

  <script src="./shared/convert.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
