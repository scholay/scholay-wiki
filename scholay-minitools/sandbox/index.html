<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>落沙实验室 · 元素沙盒 · 反应链解压游戏</title>
  <link rel="stylesheet" href="./shared/brand.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div class="game">
    <!-- 顶栏 -->
    <div class="gtop">
      <span class="wordmark sm" aria-label="Scholay"><span class="l-r">S</span><span class="l-g">ch</span><span class="l-a">o</span><span class="l-k">l</span><span class="l-r">a</span><span class="l-g">y</span></span>
      <div class="modes">
        <button class="mode on" id="mLevel">🎯 闯关</button>
        <button class="mode" id="mFree">🧪 自由</button>
      </div>
      <button class="iconbtn reward" id="rewardBtn" title="通关奖励">🎁</button>
      <button class="iconbtn" id="helpBtn" title="新手引导">?</button>
      <button class="iconbtn" id="infoBtn" title="玩法与科普">ℹ️</button>
    </div>

    <!-- 关卡条(仅闯关) -->
    <div class="levelbar hide" id="levelbar">
      <div class="lv-dots" id="lvDots"></div>
      <div class="lv-row">
        <div class="lv-l">
          <div class="lv-name" id="lvName"></div>
          <div class="lv-brief" id="lvBrief"></div>
        </div>
        <div class="lv-prog" id="lvProgress"></div>
      </div>
    </div>

    <!-- 舞台 -->
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">👆 手指涂抹作画 · 试试点燃沙丘上的 💣</div>
      <div class="lv-result" id="lvResult"></div>
    </div>

    <!-- 底部操作区 -->
    <div class="dock">
      <div class="palette" id="palette"></div>
      <div class="ctlrow">
        <div class="sizes" id="sizes"></div>
        <div class="grow"></div>
        <div class="ctlgrp" id="freeCtl">
          <button class="ctl" id="rainBtn">🌧</button>
          <button class="ctl" id="clearBtn">🧹</button>
        </div>
        <div class="ctlgrp hide" id="levelCtl">
          <button class="ctl" id="retryBtn">↻ 重来</button>
          <button class="ctl accent hide" id="nextBtn">下一关 →</button>
        </div>
        <button class="ctl" id="pauseBtn">⏸</button>
      </div>
    </div>
  </div>

  <!-- 信息弹层 -->
  <div class="sheet hide" id="infoSheet">
    <div class="sheet-card">
      <button class="sheet-x" id="infoClose">✕</button>
      <div class="sheet-h">🧪 试试这些反应组合</div>
      <div id="combos"></div>
      <div class="sheet-h">💡 这背后的科学</div>
      <div class="facts" id="facts"></div>
      <div class="disclaimer" id="disclaimer"></div>
      <div data-cta="喜欢玩科学?<span class=&quot;hl&quot;>Scholay</span> 还有更多科研神器"></div>
      <div data-foot></div>
    </div>
  </div>

  <!-- 通关奖励弹层 -->
  <div class="sheet hide" id="rewardSheet">
    <div class="sheet-card reward-card">
      <button class="sheet-x" id="rewardClose">✕</button>
      <div class="reward-hero">
        <div class="reward-medal" id="rewardMedal">🎁</div>
        <div class="reward-prize" id="rewardPrize"></div>
        <h2 id="rewardTitle"></h2>
        <p id="rewardSub"></p>
      </div>
      <div class="reward-track" id="rewardTrack"></div>
      <!-- 未通关:进度提示 -->
      <div id="rewardLocked" class="reward-locked"></div>
      <!-- 已通关:领取区 -->
      <div id="rewardClaim" class="reward-claim hide">
        <div class="reward-qr" id="rewardQr"></div>
        <ol class="reward-steps" id="rewardSteps"></ol>
        <div class="reward-note" id="rewardNote"></div>
      </div>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="tut hide" id="tut">
    <div class="tut-card">
      <div class="tut-emoji">🧪✨</div>
      <h2>欢迎来到<span class="hl">落沙实验室</span></h2>
      <div class="tut-prize" id="tutPrize"></div>
      <div class="tut-steps">
        <div class="ts"><span>1</span>手指在画面上<b>涂抹</b>画出元素,完成<b>关卡目标</b></div>
        <div class="ts"><span>2</span>玩转<b>反应</b>:火烧植物 · 岩浆遇水 · 炸药连锁💥</div>
        <div class="ts"><span>3</span><b>通关全部 20 关</b>,免费领 <b>Scholay 会员 1 个月</b>🎁</div>
      </div>
      <button class="tut-go" id="tutStart">开始闯关 →</button>
    </div>
  </div>

  <script src="./shared/convert.js"></script>
  <script src="./data.js"></script>
  <script src="./sim.js"></script>
  <script src="./levels.js"></script>
  <script src="./app.js"></script>
</body>
</html>
