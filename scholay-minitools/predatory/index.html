<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>掠夺性期刊红旗自测 · 投稿避坑体检</title>
  <link rel="stylesheet" href="./shared/brand.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div class="app">
    <div class="brandbar">
      <span class="wordmark"><span class="dot">S</span><b>Scholay</b></span>
      <span class="tag">投稿避坑体检</span>
    </div>

    <div class="hero">
      <span class="eyebrow">别被水刊 / 野鸡刊 / 劫持刊坑了</span>
      <h1>这本期刊<span class="hl">靠谱吗</span>?</h1>
      <p>18 项红旗自测 · 实时风险评分 · 11 个官方核实渠道</p>
    </div>

    <div class="card riskcard">
      <div class="risk-head">
        <div>
          <div class="risk-score"><span id="scoreNum">0</span><span class="pct">%</span></div>
          <div class="risk-level" id="levelLbl">尚未勾选</div>
        </div>
        <div class="risk-emoji" id="riskEmoji">🩺</div>
      </div>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="meter-scale"><span>低风险</span><span>需留意</span><span>偏高</span><span>高危</span></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="num">✓</span>逐条勾出命中的红旗</div>
      <div id="flags"></div>
      <button class="btn" id="diagBtn" style="margin-top:16px"><span class="shine"></span>生成风险诊断</button>
    </div>

    <div id="result" class="result"></div>

    <div class="card"><div class="card-title"><span class="num">🎭</span>识破劫持 / 仿冒期刊</div>
      <div class="sec-sub" id="hijackIntro"></div>
      <div id="hijackHow"></div>
    </div>

    <div class="card"><div class="card-title"><span class="num">Q</span>常见问题</div>
      <div id="faqs"></div>
    </div>

    <div class="disclaimer" id="disclaimer"></div>
    <div data-cta="查这本刊到底什么来头,<span class=&quot;hl&quot;>Scholay 期刊检索</span>几秒看清"></div>
    <div data-foot></div>
  </div>

  <script src="./shared/convert.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
