# Scholar agent egress 代理 —— 基础配置(Filter 段由 entrypoint.sh 按 EGRESS_FILTER_MODE 追加)。
# 作用:agent 在 internal 网里无 NAT 出口,所有出网经此代理 —— 统一可观测 + 可随时收紧。

Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 200
LogLevel Info

# 不设 LogFile/Syslog —— 前台(-d)运行时直接写 stdout,docker logs scholar_egress_proxy 可见。
PidFile "/tmp/tinyproxy.pid"

# 只允许 CONNECT 到 443 —— 即便 open 模式也挡掉 CONNECT mysql:3306 / redis:6379 / backend:8080 等内网端口探测。
# (mysql/redis/minio 还另外被网络层隔离:egress-proxy 不在 scholar-network 上,根本路由不到。)
ConnectPort 443
