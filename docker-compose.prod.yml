# ============================================================
# Scholay 生产环境 Docker Compose
#
# 用预构建的阿里云 ACR 镜像,服务器无需本地编译。
#   docker-compose -f docker-compose.prod.yml pull       # 拉最新镜像
#   docker-compose -f docker-compose.prod.yml up -d      # 启动
#
# 与 dev (docker-compose.yml) 主要差异:
#   - backend / agent / frontend-user 用 ACR 镜像 (image:),不本地 build:
#   - JWT_SECRET / MYSQL_ROOT_PASSWORD / MINIO_ROOT_PASSWORD 等 secret 强制 required
#   - nginx 单一对外端口 HTTP_PORT,/admin /analytics 等 v2 路径同走这个端口
#
# 镜像 tag 默认 `latest`;生产建议改成具体 git-sha / 版本号,通过 `IMAGE_TAG=v1.2.3` 注入。
# ============================================================

# 全局日志配置: 每个容器最多保留 7 个日志文件,每个文件最大 10MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

# 时区统一为北京时间 —— 所有容器跟随宿主机,不做任何 timezone 转换。
#
# TZ 值用冒号前缀 `:/etc/localtime` 是 POSIX libc 标准语法:
# 告诉 libc 不要去查 /usr/share/zoneinfo,直接读这个文件作为 tz 数据。
# 这样无论镜像有没有装 tzdata(alpine 默认就没,如 umami/minio),
# 全部都直接吃宿主挂进来的 /etc/localtime,行为完全一致。
#
# 配合 volumes 里挂 `- /etc/localtime:/etc/localtime:ro`,实现真正的"跟随宿主"。
# YAML 不能合并列表,所以 volumes 那行每个服务都手写。
x-tz-env: &tz-env
  TZ: ":/etc/localtime"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    # --slow-query-log=0: 同 dev compose, 关闭无 rotation 的 /var/lib/mysql/slow.log
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --slow-query-log=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # MinIO 对象存储 —— 用户上传的 PDF 文件本体
  minio:
    image: minio/minio:latest
    container_name: scholar_minio
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "9000"
      - "9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
    volumes:
      - ./data/minio:/data
      - /etc/localtime:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
      - /etc/localtime:/etc/localtime:ro
    # AOF: appendfsync everysec (每秒 fsync,性能/持久化平衡)
    # slowlog: 记录 >10ms 命令,最多 256 条,排查热点 key
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --slowlog-log-slower-than 10000
      --slowlog-max-len 256
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # Redis(correctness 键专用,noeviction)—— 可选,与 dev compose 一致。
  # 启用:在 .env 设 REDIS_PERSIST_HOST=scholar_redis_persist;未设则相关键回落主 Redis。
  # noeviction:写满返回 OOM 而非逐出 —— 吊销/配额/SEO队列宁可写失败也不静默丢。
  redis-persist:
    image: redis:7-alpine
    container_name: scholar_redis_persist
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis-persist:/data
      - /etc/localtime:/etc/localtime:ro
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # 数据库迁移服务 - 每次启动按顺序执行 migrations/ 下的 SQL 文件
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      # run-migrations.sh 用 root 自动 CREATE umami 库并 GRANT 给 scholar_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
    volumes:
      - ./docker/mysql/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts:/app/scripts:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/run-migrations.sh
    restart: "no"

  backend:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/backend:${IMAGE_TAG:-latest}
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      # release 模式:激活默认密钥/密码 fail-fast、支付金额篡改校验、JSON 结构化日志。
      # 不设的话 gin 默认 debug, 这些"release 才生效"的安全分支全部静默失活。
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # 生产硬要求自带 JWT_SECRET —— 不允许走默认占位符
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in prod (>=32 chars random)}
      SERVER_PORT: 8080
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required in prod}
      # 旧前端 frontend-user URL —— 后端发送邮件等场景里拼链接用
      FRONTEND_USER_URL: http://frontend-user:80
      # 站点 / 第三方服务地址(单一来源 .env 的 SITE_URL/SITE_NAME/..., fan-out 给 backend)
      SEO_BASE_URL: ${SITE_URL:?SITE_URL is required in prod}
      SITE_NAME: ${SITE_NAME:-Scholay}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@scholay.com}
      # 主动 SEO 提交 (详见 .env 注释段)
      SEO_SUBMIT_ENABLED: ${SEO_SUBMIT_ENABLED:-false}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BAIDU_PUSH_ENABLED: ${BAIDU_PUSH_ENABLED:-false}
      BAIDU_PUSH_TOKEN: ${BAIDU_PUSH_TOKEN:-}
      BAIDU_PUSH_SITE: ${BAIDU_PUSH_SITE:-}
      BAIDU_PUSH_DAILY_QUOTA: ${BAIDU_PUSH_DAILY_QUOTA:-1000}
      SEO_PUSH_WORKER_INTERVAL_SECONDS: ${SEO_PUSH_WORKER_INTERVAL_SECONDS:-300}
      SEO_PUSH_BATCH_SIZE: ${SEO_PUSH_BATCH_SIZE:-100}
      # MinIO 对象存储 (用户上传 PDF)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
      MINIO_BUCKET_PAPER_PDFS: ${MINIO_BUCKET_PAPER_PDFS:-scholar-paper-pdfs}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # CORS 白名单 —— 生产必须列具体 origin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in prod}
      # Umami HTTP API 接入 —— admin /analytics 走 backend 自渲染图表
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # AI Agent 桥接 —— backend POST agent /api/providers 必须带这个 Bearer
      # 与 agent 容器的 ANTHROPIC_API_KEY 同源 (AGENT_INTERNAL_TOKEN)。
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://scholar_agent:3456}
      AGENT_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in prod}
      # 智能审稿: backend 按 slug 读审稿人 skill 的「评分人格」段注入评分轮 (见 peerreview)。
      PEERREVIEW_SKILLS_DIR: ${PEERREVIEW_SKILLS_DIR:-/app/reviewer-skills}
      # Prism 写作 skill 经 --add-dir 加载的目录(agent 容器内 <此处>/.claude/skills)。
      PRISM_SKILL_ADDDIR: ${PRISM_SKILL_ADDDIR:-/prism-add}
      # Prism 编译任务共享目录(与 scholar_prism_tex 同卷)
      PRISM_WORK_DIR: ${PRISM_WORK_DIR:-/data/prism-work}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 审稿人 skill 库 (reviewer-roster + rv-*, 已移到 reviewer-skills/, claw 看不到): backend 只读读 SCORING_PERSONA。
      - ./agent/data/claude/reviewer-skills:/app/reviewer-skills:ro
      # Prism 编译任务共享卷(后端写任务,scholar_prism_tex watcher 编译回写)
      - ./data/prism-work:/data/prism-work
    expose:
      - "8080"
    # /health 会 ping MySQL+Redis —— 容器级健康信号, 让 nginx/编排能识别"起来了但依赖挂了"的退化态
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network
      # backend 同时在 scholar-agent-net 上, 才能解析/调用 scholar_agent:3456 (CreateSession / ServerSideChat / WS)。
      - scholar-agent-net

  # AI agent 服务 (Bun + TypeScript,源在 agent/)
  # 模型/端点配置最终走 DB,backend 启动后 POST 到 /api/providers 热更新;
  # 下面的 ANTHROPIC_* 仅作冷启动到 backend 推送之间的 bootstrap,允许为空。
  agent:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/agent:${IMAGE_TAG:-latest}
    container_name: scholar_agent
    restart: unless-stopped
    depends_on:
      - egress-proxy
    logging: *default-logging
    environment:
      <<: *tz-env
      # 内网 Bearer 鉴权 token (backend → agent),与 backend AGENT_AUTH_TOKEN 同值
      ANTHROPIC_API_KEY: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in prod}
      # agent → backend 内网回调地址(上报「带外」token 用量,如会话标题生成)。NO_PROXY 含 scholar_backend → 直连。
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://scholar_backend:8080}
      ANTHROPIC_BASE_URL: ${AGENT_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${AGENT_ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_MODEL: ${AGENT_ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${AGENT_ANTHROPIC_HAIKU_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${AGENT_ANTHROPIC_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${AGENT_ANTHROPIC_OPUS_MODEL:-}
      API_TIMEOUT_MS: ${AGENT_API_TIMEOUT_MS:-600000}
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      MINICOD_API_KEY: ${AGENT_MINICOD_API_KEY:-}
      # 出网经 egress-proxy —— scholar-agent-net 是 internal(无 NAT),agent 只能经代理出公网。
      # 默认 open 放行一切外部 HTTPS。生产收紧设 EGRESS_FILTER_MODE=allowlist + egress/filter 列上游域名。
      HTTPS_PROXY: ${AGENT_HTTPS_PROXY:-http://scholar_egress_proxy:3128}
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-http://scholar_egress_proxy:3128}
      NO_PROXY: ${AGENT_NO_PROXY:-localhost,127.0.0.1,scholar_backend,backend,scholar_agent}
      # 让 --add-dir 目录里的 CLAUDE.md 也作为始终生效的 Project 记忆加载 (默认关)。
      # 仅 /claw-add/CLAUDE.md 存在 → 只影响 claw。用途: claw 的渲染约束(渲染 mermaid/svg/表格,
      # 禁 ASCII 画图 / 禁为渲染生成 HTML)放 claw 专属 CLAUDE.md, 不占系统提示词。
      CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "1"
    expose:
      - "3456"
    volumes:
      - ./data/agent:/home/bun/.claude
      # committed 的**共享** skill (paper-review/journal-fit/citation-audit) 叠挂到 .claude/skills, 所有会话可见。
      - ./agent/data/claude/skills:/home/bun/.claude/skills:ro
      # 审稿人 skill (reviewer-roster + rv-*) 独立目录, 仅 peerreview 方法论会话经 --add-dir /peerreview-add 加载 → claw 看不到。
      - ./agent/data/claude/reviewer-skills:/peerreview-add/.claude/skills:ro
      # 智能写作 skill 独立目录, 仅 prism 会话经 --add-dir /prism-add 加载 → claw/审稿看不到。
      - ./agent/data/claude/prism-skills:/prism-add/.claude/skills:ro
      # 智能助手 add-dir (/claw-add): 整目录挂载 —— .claude/skills (library-reference)
      # + CLAUDE.md (渲染约束, 需上面 CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1)。
      # 仅 claw 会话经 --add-dir /claw-add 加载 → smart_search/prism/审稿看不到。
      - ./agent/data/claude/claw-add:/claw-add:ro
      # 会话工作目录 (cwd + 上传文件) 持久化 —— 否则重建容器(重部署)会清空, 旧会话续聊报
      # "Working directory does not exist"。属主由镜像 entrypoint 自愈 (chown 到 bun)。
      - ./data/agent-sessions:/home/bun/sessions
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3456/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 安全加固 (Scholay): agent 跑模型生成的任务, 生产最需要这些控制 —— 与 dev compose 对齐。
    # 此前 prod 漏抄, 只有 memory 限制: 无 fork-bomb 防护(pids)、无 CPU 上限、无提权防御。
    cap_drop:
      - ALL                          # agent 不需要任何 Linux capability (非 root, 端口 >1024)
    security_opt:
      - no-new-privileges:true       # 禁止 setuid 提权
    deploy:
      resources:
        limits:
          memory: 1.5G               # agent 资源大头 (LLM 流式 + Bash 转换 + PDF 解析); 单会话峰值 ~765MiB, 1.5G 给并发留头
          cpus: "2.0"                # CPU 上限, 防单个重任务 (大 PDF 解析 / 死循环) 拖垮整机
          pids: 512                  # 进程数上限, 挡 fork 炸弹 (Bash 转换会起 pandoc/python 子进程, 512 仍宽裕)
        reservations:
          memory: 256M
    networks:
      # 安全隔离: agent 只在 scholar-agent-net(internal,无 NAT)上,够不到 mysql/redis/minio/umami;出公网只能经 egress-proxy。
      - scholar-agent-net

  # agent 出公网的唯一出口:tinyproxy 代理(源在 egress/)。默认 open;EGRESS_FILTER_MODE=allowlist 收紧到 egress/filter。
  # 生产用 ACR 镜像(build-and-push 推、deploy 拉),与 backend/agent/frontend 一致 —— 服务器不本地 build。
  egress-proxy:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/egress:${IMAGE_TAG:-latest}
    container_name: scholar_egress_proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      EGRESS_FILTER_MODE: ${EGRESS_FILTER_MODE:-open}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - scholar-agent-net
      - egress-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

  # Scholay Prism LaTeX 编译沙箱 (源在 prism_tex/)。生产用 ACR 镜像。
  # 与后端只经共享卷 ./data/prism-work 通信,network_mode: none 彻底断网 + 全套硬化。
  prism-tex:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/prism_tex:${IMAGE_TAG:-latest}
    container_name: scholar_prism_tex
    # 与 backend(appuser uid 1001)同 uid 跑 —— 编译任务目录在共享卷 ./data/prism-work 里
    # 由 backend(1001)创建,prism-tex 必须也是 1001 才能写回 status.json/pdf(cap_drop ALL
    # 后 root 没了 DAC_OVERRIDE,跨 uid 写不了)。deploy.sh 会把该卷 chown 到 1001:1001。
    user: "1001:1001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      COMPILE_TIMEOUT: ${PRISM_COMPILE_TIMEOUT:-60}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./data/prism-work:/work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
          pids: 256
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 30 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend-user:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/frontend-user:${IMAGE_TAG:-latest}
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 发版灰度:持久化 hash 分包目录,旧版本 chunk 跨发版保留(默认 7 天,见
      # frontend-user/docker-entrypoint.d/40-sync-site.sh)→ 老标签页发版后跳转不再「页面加载失败」。
      - ./data/frontend-assets:/usr/share/nginx/html/assets
    expose:
      - "80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network


  # Umami 自托管分析 —— 单容器,共用 scholar_mysql 的 `umami` 库
  # (schema-sync 首次启动自动创建 umami 库 + 授权;umami 内部 prisma 跑建表)
  # UI 不对外,admin /analytics 走 backend HTTP API 自渲染图表。
  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: scholar_umami
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DATABASE_TYPE: mysql
      # connection_limit=5 显式限住 Prisma 连接池: 不设的话 Prisma 默认 num_cpus*2+1(8 核=17),
      # 与 backend 池(90)合计可能逼近/超过 MySQL max_connections=100, 触发 "Too many connections"。
      # umami 写入量很低, 5 条足够。性能审计 infra。
      DATABASE_URL: mysql://${MYSQL_USER:-scholar_user}:${MYSQL_PASSWORD}@mysql:3306/umami?connection_limit=5
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required in prod (>=32 chars random)}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script
    volumes:
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  nginx:
    image: nginx:alpine
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    ports:
      # 主入口 (含 /admin 路径)。umami UI / tracker 都通过这个端口的反代,不另开端口。
      - "${HTTP_PORT:-5411}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - backend
      - frontend-user
      - umami
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge
  # 安全隔离: backend↔agent↔egress-proxy 内部网,internal=无 NAT —— agent 出公网只能经 egress-proxy。
  scholar-agent-net:
    driver: bridge
    internal: true
  # 只有 egress-proxy 在这张网上,它是唯一能 NAT 出公网的容器。
  egress-net:
    driver: bridge
