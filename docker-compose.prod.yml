# ============================================================
# Scholay 生产环境 Docker Compose
#
# 用预构建的阿里云 ACR 镜像,服务器无需本地编译。
#   docker-compose -f docker-compose.prod.yml pull       # 拉最新镜像
#   docker-compose -f docker-compose.prod.yml up -d      # 启动
#
# 与 dev (docker-compose.yml) 主要差异:
#   - backend / frontend-user 用 ACR 镜像 (image:),不本地 build:
#   - JWT_SECRET / MYSQL_ROOT_PASSWORD / MINIO_ROOT_PASSWORD 等 secret 强制 required
#   - nginx 单一对外端口 HTTP_PORT,/admin /analytics 等 v2 路径同走这个端口
#
# 镜像 tag 默认 `latest`;生产建议改成具体 git-sha / 版本号,通过 `IMAGE_TAG=v1.2.3` 注入。
# ============================================================

# 全局日志配置: 每个容器最多保留 7 个日志文件,每个文件最大 10MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # MinIO 对象存储 —— 用户上传的 PDF 文件本体
  minio:
    image: minio/minio:latest
    container_name: scholar_minio
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
      TZ: Asia/Shanghai
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
    # AOF: appendfsync everysec (每秒 fsync,性能/持久化平衡)
    # slowlog: 记录 >10ms 命令,最多 256 条,排查热点 key
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --slowlog-log-slower-than 10000
      --slowlog-max-len 256
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # 数据库迁移服务 - 每次启动按顺序执行 migrations/ 下的 SQL 文件
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      # run-migrations.sh 用 root 自动 CREATE umami 库并 GRANT 给 scholar_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
    volumes:
      - ./docker/mysql/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/run-migrations.sh
    restart: "no"

  backend:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/backend:${IMAGE_TAG:-latest}
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # 生产硬要求自带 JWT_SECRET —— 不允许走默认占位符
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in prod (>=32 chars random)}
      SERVER_PORT: 8080
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required in prod}
      # 旧前端 frontend-user URL —— 后端发送邮件等场景里拼链接用
      FRONTEND_USER_URL: http://frontend-user:80
      # 站点 / 第三方服务地址(单一来源 .env 的 SITE_URL/SITE_NAME/..., fan-out 给 backend)
      SEO_BASE_URL: ${SITE_URL:?SITE_URL is required in prod}
      SITE_NAME: ${SITE_NAME:-Scholay}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@scholay.com}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-api@scholay.com}
      PDF_SERVICE_URL: ${PDF_SERVICE_URL:-https://pdf.scholay.com/api/v1/pdf}
      # 主动 SEO 提交 (详见 .env 注释段)
      SEO_SUBMIT_ENABLED: ${SEO_SUBMIT_ENABLED:-false}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BAIDU_PUSH_ENABLED: ${BAIDU_PUSH_ENABLED:-false}
      BAIDU_PUSH_TOKEN: ${BAIDU_PUSH_TOKEN:-}
      BAIDU_PUSH_SITE: ${BAIDU_PUSH_SITE:-}
      BAIDU_PUSH_DAILY_QUOTA: ${BAIDU_PUSH_DAILY_QUOTA:-1000}
      SEO_PUSH_WORKER_INTERVAL_SECONDS: ${SEO_PUSH_WORKER_INTERVAL_SECONDS:-300}
      SEO_PUSH_BATCH_SIZE: ${SEO_PUSH_BATCH_SIZE:-100}
      # peer-review V2 外部审稿服务
      PEER_REVIEW_API_KEY: ${PEER_REVIEW_API_KEY:-}
      PEER_REVIEW_BASE_URL: ${PEER_REVIEW_BASE_URL:-https://peer.scholay.com}
      # MinIO 对象存储 (用户上传 PDF)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
      MINIO_BUCKET_PAPER_PDFS: ${MINIO_BUCKET_PAPER_PDFS:-scholar-paper-pdfs}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # CORS 白名单 —— 生产必须列具体 origin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in prod}
      # Umami HTTP API 接入 —— admin /analytics 走 backend 自渲染图表
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network

  frontend-user:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/frontend-user:${IMAGE_TAG:-latest}
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network


  # Umami 自托管分析 —— 单容器,共用 scholar_mysql 的 `umami` 库
  # (schema-sync 首次启动自动创建 umami 库 + 授权;umami 内部 prisma 跑建表)
  # UI 不对外,admin /analytics 走 backend HTTP API 自渲染图表。
  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: scholar_umami
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_TYPE: mysql
      DATABASE_URL: mysql://${MYSQL_USER:-scholar_user}:${MYSQL_PASSWORD}@mysql:3306/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required in prod (>=32 chars random)}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script
      TZ: Asia/Shanghai
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  nginx:
    image: nginx:alpine
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 主入口 (含 /admin 路径)。umami UI / tracker 都通过这个端口的反代,不另开端口。
      - "${HTTP_PORT:-5411}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend-user
      - umami
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

networks:
  scholar-network:
    driver: bridge
