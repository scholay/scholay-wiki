# ============================================================
# Scholay 生产环境 Docker Compose
#
# 用预构建的阿里云 ACR 镜像,服务器无需本地编译。
#   docker-compose -f docker-compose.prod.yml pull       # 拉最新镜像
#   docker-compose -f docker-compose.prod.yml up -d      # 启动
#
# 与 dev (docker-compose.yml) 主要差异:
#   - backend / agent / frontend-user 用 ACR 镜像 (image:),不本地 build:
#   - JWT_SECRET / MYSQL_ROOT_PASSWORD / MINIO_ROOT_PASSWORD 等 secret 强制 required
#   - nginx 单一对外端口 HTTP_PORT,/admin /analytics 等 v2 路径同走这个端口
#
# 镜像 tag 默认 `latest`;生产建议改成具体 git-sha / 版本号,通过 `IMAGE_TAG=v1.2.3` 注入。
# ============================================================

# 全局日志配置: 每个容器最多保留 7 个日志文件,每个文件最大 10MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "7"

# 时区统一为北京时间 —— 所有容器跟随宿主机,不做任何 timezone 转换。
#
# TZ 值用冒号前缀 `:/etc/localtime` 是 POSIX libc 标准语法:
# 告诉 libc 不要去查 /usr/share/zoneinfo,直接读这个文件作为 tz 数据。
# 这样无论镜像有没有装 tzdata(alpine 默认就没,如 umami/minio),
# 全部都直接吃宿主挂进来的 /etc/localtime,行为完全一致。
#
# 配合 volumes 里挂 `- ./docker/tz/Asia-Shanghai:/etc/localtime:ro`,实现真正的"跟随宿主"。
# YAML 不能合并列表,所以 volumes 那行每个服务都手写。
x-tz-env: &tz-env
  TZ: ":/etc/localtime"

services:
  mysql:
    image: mysql:8.0
    container_name: scholar_mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
    expose:
      - "3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    # --slow-query-log=0: 同 dev compose, 关闭无 rotation 的 /var/lib/mysql/slow.log
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --slow-query-log=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - scholar-network

  # MinIO 对象存储 —— 用户上传的 PDF 文件本体
  minio:
    image: minio/minio:latest
    container_name: scholar_minio
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "9000"
      - "9001"
    environment:
      <<: *tz-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
    volumes:
      - ./data/minio:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  redis:
    image: redis:7-alpine
    container_name: scholar_redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    # AOF: appendfsync everysec (每秒 fsync,性能/持久化平衡)
    # slowlog: 记录 >10ms 命令,最多 256 条,排查热点 key
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --slowlog-log-slower-than 10000
      --slowlog-max-len 256
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    networks:
      - scholar-network

  # Redis(correctness 键专用,noeviction)—— 可选,与 dev compose 一致。
  # 启用:在 .env 设 REDIS_PERSIST_HOST=scholar_redis_persist;未设则相关键回落主 Redis。
  # noeviction:写满返回 OOM 而非逐出 —— 吊销/配额/SEO队列宁可写失败也不静默丢。
  redis-persist:
    image: redis:7-alpine
    container_name: scholar_redis_persist
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    expose:
      - "6379"
    volumes:
      - ./data/redis-persist:/data
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --tcp-keepalive 60
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - scholar-network

  # 数据库迁移服务 - 每次启动按顺序执行 migrations/ 下的 SQL 文件
  schema-sync:
    image: mysql:8.0
    container_name: scholar_schema_sync
    logging: *default-logging
    environment:
      <<: *tz-env
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-scholar_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scholar}
      # run-migrations.sh 用 root 自动 CREATE umami 库并 GRANT 给 scholar_user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in prod}
    volumes:
      - ./docker/mysql/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts:/app/scripts:ro
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scholar-network
    command: bash /app/scripts/run-migrations.sh
    restart: "no"

  backend:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/backend:${IMAGE_TAG:-latest}
    container_name: scholar_backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      # release 模式:激活默认密钥/密码 fail-fast、支付金额篡改校验、JSON 结构化日志。
      # 不设的话 gin 默认 debug, 这些"release 才生效"的安全分支全部静默失活。
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-scholar_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in prod}
      DB_NAME: ${MYSQL_DATABASE:-scholar}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # correctness 键(验证码/吊销/**周期额度**/SEO 队列)专用 noeviction 实例(scholar_redis_persist)。
      # 🔴 2026-08-02 计费审计 P0-1:默认从空改成 redis-persist,与 dev compose 对齐。
      # 空值(=回落主 Redis)不是「与历史一致」这么中性 —— 主池 allkeys-lru 逐出 quota:anchor 与
      # 「窗口到期」在 loadWindow 里完全同形,用户白拿整窗额度且零日志。这条不该由 .env 是否设过决定。
      # ⚠️ 首次生效是一次存储切换(在飞窗口/吊销标记/推送队列从零开始),选低峰窗口部署。
      REDIS_PERSIST_HOST: ${REDIS_PERSIST_HOST:-redis-persist}
      REDIS_PERSIST_PORT: ${REDIS_PERSIST_PORT:-6379}
      REDIS_PERSIST_PASSWORD: ${REDIS_PERSIST_PASSWORD:-}
      REDIS_PERSIST_DB: ${REDIS_PERSIST_DB:-0}
      # 生产硬要求自带 JWT_SECRET —— 不允许走默认占位符
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in prod (>=32 chars random)}
      SERVER_PORT: 8080
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required in prod}
      # 旧前端 frontend-user URL —— 后端发送邮件等场景里拼链接用
      FRONTEND_USER_URL: http://frontend-user:80
      # 站点 / 第三方服务地址(单一来源 .env 的 SITE_URL/SITE_NAME/..., fan-out 给 backend)
      SEO_BASE_URL: ${SITE_URL:?SITE_URL is required in prod}
      # 公网 origin 原值也直接透传(邀请分享链接等要拼用户可达的公网 URL;
      # FRONTEND_USER_URL 是容器内网地址,不能给用户)—— 与 dev compose 同步
      SITE_URL: ${SITE_URL:?SITE_URL is required in prod}
      SITE_NAME: ${SITE_NAME:-Scholay}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@scholay.com}
      # 主动 SEO 提交 (详见 .env 注释段)
      SEO_SUBMIT_ENABLED: ${SEO_SUBMIT_ENABLED:-false}
      INDEXNOW_ENABLED: ${INDEXNOW_ENABLED:-false}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BAIDU_PUSH_ENABLED: ${BAIDU_PUSH_ENABLED:-false}
      BAIDU_PUSH_TOKEN: ${BAIDU_PUSH_TOKEN:-}
      BAIDU_PUSH_SITE: ${BAIDU_PUSH_SITE:-}
      BAIDU_PUSH_DAILY_QUOTA: ${BAIDU_PUSH_DAILY_QUOTA:-1000}
      SEO_PUSH_WORKER_INTERVAL_SECONDS: ${SEO_PUSH_WORKER_INTERVAL_SECONDS:-300}
      SEO_PUSH_BATCH_SIZE: ${SEO_PUSH_BATCH_SIZE:-100}
      # SEO 完整性回填(H1 论文摘要 + M2 冷门 URL 现拉):默认关,置 true 才消耗 minicod 配额
      SEO_ENRICH_ENABLED: ${SEO_ENRICH_ENABLED:-false}
      # MinIO 对象存储 (用户上传 PDF)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-scholarminio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in prod}
      MINIO_BUCKET_PAPER_PDFS: ${MINIO_BUCKET_PAPER_PDFS:-scholar-paper-pdfs}
      # agent 输入框上传附件(0112 耐久化)。⚠️ 其余几个桶(feedback/peer-review/prism/
      # agent-artifacts/skill-bundles)靠 config.go 的默认值,不在这里透传;这一条显式写出来
      # 是因为它已写进 .env.example —— 文档里有、compose 不透传 = 改了不生效的静默陷阱。
      MINIO_BUCKET_AGENT_ATTACHMENTS: ${MINIO_BUCKET_AGENT_ATTACHMENTS:-scholar-agent-attachments}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # 附件孤儿对象 reaper 是否真删(默认 false = 只报告)。同上一条的理由必须显式透传:
      # 写进了 .env.example 却不透传 = 运维照文档设了 true 却毫无效果的静默陷阱。
      AGENT_ATTACHMENT_REAPER_DELETE: ${AGENT_ATTACHMENT_REAPER_DELETE:-false}
      # CORS 白名单 —— 生产必须列具体 origin
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in prod}
      # Umami HTTP API 接入 —— admin /analytics 走 backend 自渲染图表
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # AI Agent 桥接 —— backend POST agent /api/providers 必须带这个 Bearer
      # 与 agent 容器的 ANTHROPIC_API_KEY 同源 (AGENT_INTERNAL_TOKEN)。
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://scholar_agent:3456}
      AGENT_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in prod}
      # Web-native:executor 是唯一 agent 后端,4 个 feature 全走它 + 历史走事件溯源 journal。
      # journal 是历史唯一真源(老会话回退 agent_session_archive),必须 shadow。
      AGENT_TURN_JOURNAL: ${AGENT_TURN_JOURNAL:-shadow}
      AGENT_EXECUTOR_BASE_URL: ${AGENT_EXECUTOR_BASE_URL:-http://scholar_agent:3456}
      AGENT_EXECUTOR_FEATURES: ${AGENT_EXECUTOR_FEATURES:-smart_search,claw,prism,peerreview,boltslides,sci_draw,stat_lab}
      # P6 历史迁移:开机从老 fork jsonl(/fork-data,只读挂载)折叠归档老会话(幂等,迁完自动 no-op)。
      AGENT_ARCHIVE_FROM_JSONL: ${AGENT_ARCHIVE_FROM_JSONL:-/fork-data}
      # 智能审稿: backend 按 slug 读审稿人 skill 的「评分人格」段注入评分轮 (见 peerreview)。
      PEERREVIEW_SKILLS_DIR: ${PEERREVIEW_SKILLS_DIR:-/app/reviewer-skills}
      # 审查视角(lens)库:多技能组合 —— 每位审稿人可叠加 0-2 个 lens。backend 按 slug 读 <<<LENS>>> 段。
      PEERREVIEW_LENSES_DIR: ${PEERREVIEW_LENSES_DIR:-/app/reviewer-lenses}
      # Prism 写作 skill 经 --add-dir 加载的目录(agent 容器内 <此处>/.claude/skills)。
      PRISM_SKILL_ADDDIR: ${PRISM_SKILL_ADDDIR:-/prism-add}
      # Prism base 写作人格库(pw-*):backend 只读读 <<<WRITING_PERSONA>>> 段 in-band 注入(Phase 2)。
      PRISM_PERSONAS_DIR: ${PRISM_PERSONAS_DIR:-/app/prism-personas}
      # smart_search 检索策略 skill 经 --add-dir 加载的目录(agent 容器内 <此处>/.claude/skills)。
      SMART_SEARCH_SKILL_ADDDIR: ${SMART_SEARCH_SKILL_ADDDIR:-/smart-search-add}
      # 制作PPT(boltslides)bolt-slides skill 经 --add-dir 加载的目录(agent 容器内 <此处>/.claude/skills)。
      BOLT_SLIDES_SKILL_ADDDIR: ${BOLT_SLIDES_SKILL_ADDDIR:-/bolt-slides-add}
      # 科研绘图(sci_draw)会话经 --add-dir 加载绘图 skill 的目录(agent 容器内 <此处>/.claude/skills)。
      SCI_DRAW_SKILL_ADDDIR: ${SCI_DRAW_SKILL_ADDDIR:-/sci-draw-add}
      # 数据分析 skill 注入点(spec.go 的 statLabSkillAddDir 读它;缺省 /stat-lab-add)。
      STAT_LAB_SKILL_ADDDIR: ${STAT_LAB_SKILL_ADDDIR:-/stat-lab-add}
      # Prism 编译任务共享目录(与 scholar_prism_tex 同卷)
      PRISM_WORK_DIR: ${PRISM_WORK_DIR:-/data/prism-work}
      # Go memory limit (75% of container memory limit)
      GOMEMLIMIT: 768MiB
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      # 审稿人 skill 库 (reviewer-roster + rv-*): backend 只读读 SCORING_PERSONA。源已移到 ./agent-skills(fork 退役)。
      - ./agent-skills/reviewer-skills:/app/reviewer-skills:ro
      # 审查视角(lens)库 —— 多技能组合,backend 只读读 <<<LENS>>> 段拼进审稿人 prompt。
      - ./agent-skills/reviewer-lenses:/app/reviewer-lenses:ro
      # Prism base 写作人格库(pw-*):backend 只读读 <<<WRITING_PERSONA>>> 段 in-band 注入(Phase 2)。
      - ./agent-skills/prism-personas:/app/prism-personas:ro
      # Prism 编译任务共享卷(后端写任务,scholar_prism_tex watcher 编译回写)
      - ./data/prism-work:/data/prism-work
      # P6 历史迁移:老 fork jsonl 只读挂入,开机自动折叠归档进 agent_session_archive(幂等,迁完 no-op)。
      - ./data/agent:/fork-data:ro
    expose:
      - "8080"
    # /health 会 ping MySQL+Redis —— 容器级健康信号, 让 nginx/编排能识别"起来了但依赖挂了"的退化态
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # correctness 键池:必须等它 healthy 再起 backend。InitRedisPersist 连不上是**静默降级**
      # (回落主 Redis + 一条 Warn),冷启动竞速会让额度键悄悄躺回会被 LRU 逐出的主池 ——
      # 那正是 2026-08-02 审计 P0-1 的现网形态。用 depends_on 把它变成确定性的。
      redis-persist:
        condition: service_healthy
      minio:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - scholar-network
      # backend 同时在 scholar-agent-net 上, 才能解析/调用 scholar_agent:3456 (CreateSession / ServerSideChat / WS)。
      - scholar-agent-net

  # AI agent 服务 (Bun + TypeScript,源在 agent/)
  # 模型/端点配置最终走 DB,backend 启动后 POST 到 /api/providers 热更新;
  # 下面的 ANTHROPIC_* 仅作冷启动到 backend 推送之间的 bootstrap,允许为空。
  # clean-room executor(原 cc-haha fork 已退役;镜像/容器名沿用 agent)。直连公网(经 egress-net NAT),
  # egress 容器已合并;数据面隔离仍在(只接 scholar-agent-net + egress-net,不接 scholar-network)。
  agent:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/agent:${IMAGE_TAG:-latest}
    container_name: scholar_agent
    restart: unless-stopped
    # init: true —— 让 docker 塞一个 PID 1 的 init 进程负责 reap 僵尸子进程。
    # 🔴 不加这行的后果(dev 实测):单会话 4 分钟漏 78 个 pid、累计 82 个僵尸,PPID=1 永不回收。
    #    Bash 工具每次起子进程(bwrap → sh → python/pandoc),bun 不是 init、不 reap ⇒ 只增不减。
    #    prod 有 `pids: 512` 上限 ⇒ 约 6 个重 Bash 会话就打满,之后该容器所有 Bash 全失败,
    #    且**只能靠重启复位**。Run 引擎会把 Bash 调用集中到少数 Step,压强只会更高。
    init: true
    logging: *default-logging
    environment:
      <<: *tz-env
      # Bun/ICU 不认 ":/etc/localtime" 文件形式,JS 层需 IANA 名(与 dev 同步,2026-07-15)。
      TZ: "Asia/Shanghai"
      PORT: 3456
      # 生产标记:执行器据此做 secure-by-default(未沙箱 Bash 拒绝执行 + 未配 token 时 fail-closed 告警)。
      # dev compose 刻意不设 → 本机单租户可裸跑 Bash。
      NODE_ENV: production
      # 会话 cwd 根 —— 必须与 backend agentSessionWorkdirRoot() 默认一致(权限判定按此 confine 绝对路径)。
      SESSIONS_ROOT: /home/bun/sessions
      # 内网 Bearer:与 backend AGENT_AUTH_TOKEN(= AGENT_INTERNAL_TOKEN)同值,否则 PushConfig/WS 401。
      EXECUTOR_AUTH_TOKEN: ${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN is required in prod}
      # Minicod MCP 凭证(执行器 spawn @minicod/mcp-server stdio 透传)。
      MINICOD_API_KEY: ${AGENT_MINICOD_API_KEY:-}
      MINICOD_API_BASE_URL: ${MINICOD_API_BASE_URL:-https://www.minicod.com/v1}
      # ExportDocument 的 PDF 引擎(镜像已装 weasyprint;registry.ts 读此 env 启用 pdf 目标,
      # 缺省=pdf 优雅降级。2026-07 审计:此 env 从未配置是「半月 0 个 pdf」的另一半根因)。
      EXECUTOR_PDF_ENGINE: weasyprint
      # 沙箱:none(默认) | bwrap(生产真内核,需放开 userns)。bash 凭据安全已由 env 白名单兜底,
    expose:
      - "3456"
    volumes:
      # per-feature skill / CLAUDE.md(--add-dir):源已从 agent/data/claude 移到 ./agent-skills(fork 退役)。
      - ./agent-skills/claw-add:/claw-add:ro
      - ./agent-skills/prism-skills:/prism-add/.claude/skills:ro
      # Prism 写作 lens(craft/rigor):按需加载(guides/ → 菜单行常驻 + Skill 工具懒加载正文)。
      - ./agent-skills/prism-lenses:/prism-add/guides:ro
      # ⚠️ 这里曾有 `./agent-skills/reviewer-skills:/peerreview-add/.claude/skills:ro`,
      #    2026-08 证据账本 P0-a 删除(与 docker-compose.yml 同步,理由详见那份的同位注释)。
      #    要点:零调用者(peerreview 走 server-side,reviewerSkillAddDir 无调用点)+ 回归陷阱
      #    (132KB / 33 份 SKILL.md 远超 loader TOTAL_CAP=40000,补一行 AddDirs 就会静默丢掉
      #    排序在后的全部 6 个横切质量维度,日志只有一条 warn)。
      #    backend 侧 `/app/reviewer-skills` 那份挂载在真读,**必须保留**。
      # smart_search 检索策略 skill(minicod-search-strategy):查询拆解 / 引文滚雪球 / 覆盖度自检。
      - ./agent-skills/smart-search-skills:/smart-search-add/.claude/skills:ro
      # 制作PPT(boltslides)bolt-slides 演示稿创作 skill。
      - ./agent-skills/bolt-slides-add:/bolt-slides-add/.claude/skills:ro
      # 科研绘图(sci_draw)绘图 skill(charts / figures / molecules / slides)。
      - ./agent-skills/sci-draw-skills:/sci-draw-add/.claude/skills:ro
      # 数据分析 skill:问诊协议 / verb 编排 / 解读口径 / 红线话术(只在 stat_lab 会话装)
      - ./agent-skills/stat-lab-skills:/stat-lab-add/.claude/skills:ro
      # 会话工作目录持久化(跨重部署不丢 cwd / 上传文件;产物耐久真源已在 MinIO+DB)。
      - ./data/agent-sessions:/home/bun/sessions
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3456/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # bwrap 内层沙箱(2026-07-15):Docker 默认 seccomp 把 userns/mount 系统调用门禁在
      # CAP_SYS_ADMIN 之后,cap_drop=ALL 时 bwrap 建不了命名空间。本 profile = Docker 默认
      # + 仅放行 clone/unshare/setns/mount/umount2/pivot_root(不放 bpf/perf_event_open 等),
      - seccomp=./docker/seccomp/agent-bwrap.json
      # AppArmor(2026-07-23 线上实测,修复审计 P0-4「Bash 47/65 失败 / 导出 4/4 失败」):
      # Ubuntu 24.04 宿主上有**两层独立拦截**,seccomp 放行了也不够:
      # ① docker-default profile 无 mount 规则 → jail 内 mount --make-slave / 被拒("Failed to make / slave");
      # ② 宿主 sysctl apparmor_restrict_unprivileged_userns=1 把 unconfined 进程建 userns 转入
      #    unprivileged_userns 桩 profile(拒 capability)→ "setting up uid map: Permission denied"。
      # 两层同时解:本行摘 docker-default + 宿主跑 scripts/enable-bwrap-host.sh(sysctl=0),缺一 bwrap 起不来。
      # 实测矩阵(2026-07-23,一次性容器):unconfined 单独✗ / sysctl=0 单独✗ / 两者同时✓(jail 内 pandoc 跑通)。
      # 摘 AppArmor 后防线仍有:cap_drop ALL + no-new-privileges + 上面的自定义 seccomp + bwrap 内层 jail
      # (tmpfs 根 + 唯一可写 cwd + clearenv + 不挂 /proc)。security_opt 变更必须 up -d 重建容器,restart 无效。
      - apparmor=unconfined
    deploy:
      resources:
        limits:
          # 2026-08-05「数据分析」能力(方案 R)上调 1.5G → 4G。算式:并发槽 2 × 单会话峰值 ~765MiB
          # ≈ 1.53G,**已经把 1.5G 吃光**;statkit 子进程(pandas 读表 + bootstrap 重采样)再要 ~800MB
          # ⇒ 在 1.5G 下反算出来的可用余量是**负数**,pandas 根本没有位置。4G = 1.53G + 0.8G + 头。
          # ⚠️ 抬内存后**不要**顺手调大 EXECUTOR_MAX_CONCURRENT_TURNS(admission.ts:11 那句注释按字面
          #    读会误导):并发槽维持 2,统计计算另设 **StatRun 信号量 = 1**。理由是两者约束的东西不同 ——
          #    槽约束的是「同时几条 turn」,信号量约束的是「同时几个吃内存的统计子进程」;把槽提到 4
          #    等于允许 4 个 statkit 同时跑 = 3.2G 只给统计,又回到 OOM 杀整容器连坐所有会话的老路。
          memory: 4G
          cpus: "2.0"
          pids: 512                  # 挡 fork 炸弹(Bash 起子进程)
        reservations:
          memory: 256M
    networks:
      - scholar-agent-net # backend ↔ agent(internal,无 NAT)
      - egress-net        # agent → 公网(NAT;此网无数据面,故 agent 仍碰不到 mysql/redis)

  # (已删除)原 egress-proxy(tinyproxy)容器:agent 现直连公网(经 egress-net NAT),出口逻辑已并入 agent。

  # Scholay Prism LaTeX 编译沙箱 (源在 prism_tex/)。生产用 ACR 镜像。
  # 与后端只经共享卷 ./data/prism-work 通信,network_mode: none 彻底断网 + 全套硬化。
  prism-tex:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/prism_tex:${IMAGE_TAG:-latest}
    container_name: scholar_prism_tex
    # 与 backend(appuser uid 1001)同 uid 跑 —— 编译任务目录在共享卷 ./data/prism-work 里
    # 由 backend(1001)创建,prism-tex 必须也是 1001 才能写回 status.json/pdf(cap_drop ALL
    # 后 root 没了 DAC_OVERRIDE,跨 uid 写不了)。deploy.sh 会把该卷 chown 到 1001:1001。
    user: "1001:1001"
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      COMPILE_TIMEOUT: ${PRISM_COMPILE_TIMEOUT:-60}
      # 并发编译上限(评审 #11):默认 3,按宿主算力经 .env 调。必须与下面 CPU/内存配额同步。
      COMPILE_MAX_PARALLEL: ${PRISM_COMPILE_MAX_PARALLEL:-3}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 2026-07-15 时区彻查补挂:此前唯独本服务漏挂 → LaTeX 沙箱实跑 UTC(\today 差一天)。
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      - ./data/prism-work:/work
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        # 配额随 MAXPAR 同步(评审 #11):每个 latexmk ~0.5CPU + 250-400MB;MAXPAR=3 → 2CPU/1.5G 才不 OOM(137)/不拖慢到超时。
        limits:
          memory: 1536M
          cpus: "2.0"
          pids: 384
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 30 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend-user:
    image: ${REGISTRY:-crpi-ebrftpuujezamyxv.cn-shanghai.personal.cr.aliyuncs.com}/scholay/frontend-user:${IMAGE_TAG:-latest}
    container_name: scholar_frontend_user
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      # 发版灰度保留几代构建(见 frontend-user/docker-entrypoint.d/40-sync-site.sh)。
      # 上界 = legacy 残留(约 25-30MB,几次发版后老化掉) + KEEP × 单次构建(约 13MB)
      #      ≈ 峰值 95MB、稳态 65MB。足以覆盖「连续排障连发几版」的场景。
      # 「一代」= 一次**构建**:内容与上一代逐字节相同时复用代号,
      #   所以纯后端 hotfix 触发的整栈重启不会烧掉灰度窗口(见脚本注释)。
      # ⚠️ 2026-07-27 判据已从「保留 N 天」换成「保留 N 代」——旧的 ASSET_RETAIN_DAYS 不再生效。
      #    换判据的原因:按天时体积 = 天数 × 构建频率,同一份配置在 dev/prod 差 30 倍;
      #    且 mtime 不表达代数,旧脚本得靠 touch 伪造 mtime,那个补丁失手过一次(全站白屏 P0)。
      ASSET_KEEP_GENERATIONS: "5"
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      # 发版灰度:持久化 hash 分包目录,旧版本 chunk 跨发版保留最近 5 代 → 发版前就开着的
      # 标签页仍能拉到它那一版的 chunk,不会被迫硬刷新(而硬刷新会吞掉对话草稿 / 审稿表单)。
      - ./data/frontend-assets:/usr/share/nginx/html/assets
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network


  # Umami 自托管分析 —— 单容器,共用 scholar_mysql 的 `umami` 库
  # (schema-sync 首次启动自动创建 umami 库 + 授权;umami 内部 prisma 跑建表)
  # UI 不对外,admin /analytics 走 backend HTTP API 自渲染图表。
  umami:
    image: ghcr.io/umami-software/umami:mysql-latest
    container_name: scholar_umami
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
      DATABASE_TYPE: mysql
      # connection_limit=5 显式限住 Prisma 连接池: 不设的话 Prisma 默认 num_cpus*2+1(8 核=17),
      # 与 backend 池(90)合计可能逼近/超过 MySQL max_connections=100, 触发 "Too many connections"。
      # umami 写入量很低, 5 条足够。性能审计 infra。
      DATABASE_URL: mysql://${MYSQL_USER:-scholar_user}:${MYSQL_PASSWORD}@mysql:3306/umami?connection_limit=5
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required in prod (>=32 chars random)}
      DISABLE_TELEMETRY: "1"
      TRACKER_SCRIPT_NAME: script
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      schema-sync:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 而非 localhost:busybox wget 先试 ::1(IPv6),Next.js 只绑 IPv4 → 恒拒绝 → 假 unhealthy。
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - scholar-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: scholar-nginx
    container_name: scholar_nginx
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz-env
    ports:
      # 主入口 (含 /admin 路径)。umami UI / tracker 都通过这个端口的反代,不另开端口。
      # TLS 由宿主 Caddy 终结，只允许本机回环访问，防止绕过 Caddy/TLS 直连。
      - "127.0.0.1:${HTTP_PORT:-5411}:80"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./docker/tz/Asia-Shanghai:/etc/localtime:ro
      # 容器重建不再清空 hash 静态资源的代理缓存。
      - nginx-static-cache:/var/cache/nginx/static
    depends_on:
      - backend
      - frontend-user
      - umami
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - scholar-network

volumes:
  nginx-static-cache:

networks:
  scholar-network:
    driver: bridge
  # 安全隔离: backend↔agent 内部网,internal=无 NAT —— agent 碰不到 mysql/redis/minio。
  scholar-agent-net:
    driver: bridge
    internal: true
  # agent 经这张网 NAT 出公网(原 egress-proxy 已删,出口并入 agent)。此网无数据面容器,
  # 故 agent 接入它也碰不到 mysql/redis/minio。
  egress-net:
    driver: bridge
