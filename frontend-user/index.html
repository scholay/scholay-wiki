<!doctype html>
<html lang="zh-CN" data-paper="on">
  <head>
    <meta charset="UTF-8" />
    <!-- 标签页图标 —— 用 Figma 品牌标本体(ScholayMark,六芒星犀牛头)。
         v4(2026-08-02):标志换色为 Logo 亮色组(#427935/#F1BF45,红不变),见 ScholayMark.tsx。
         此前 v3(2026-07-28)从手搓的 S 字母方块换成真标志。

         为什么必须换文件名(favicon-v4.svg)而不是原地改 favicon.svg:
           favicon 不带内容 hash,nginx 对 svg/png 发 max-age(见 nginx.conf 与
           nginx/conf.d/user.conf 的品牌资产 location)。原地改内容,已缓存的老访客
           要等 TTL 到期才看得到。换 URL = 新访客立即生效;favicon.svg / favicon-v3.svg
           保留同内容副本,让老访客在 TTL 到期后自愈。两件事都要做,只做一件都会留长尾。

         PNG 回退:Safari 对 SVG favicon 的支持历史上不稳,给一张 32px PNG 兜底
         (同理换名 favicon-32-v2.png,旧名 favicon-32.png 保留同内容副本)。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon-v4.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png" />
    <!-- viewport-fit=cover: 移动端 /m 的底部导航用 env(safe-area-inset-bottom) 给全面屏 home indicator 让位
         maximum-scale=1 + user-scalable=no: 禁止页面缩放 —— ① 拦掉妨碍使用的误触放大/缩小;
         ② 同时阻止 iOS 聚焦输入框时的「自动放大」(maximum-scale=1 时 iOS 不再 focus-zoom)。
         注:桌面浏览器 Ctrl± 缩放不受 viewport 影响,仅作用移动端。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" />
    <!-- iOS Safari 出于无障碍会忽略 viewport 的 user-scalable=no 对「用户捏合」的限制,
         需 JS 拦截 Safari 私有 gesture 事件才能真正禁掉双指捏合放大(双击放大由 CSS touch-action 拦)。
         其他浏览器无 gesture 事件,addEventListener 即 no-op,无副作用。 -->
    <script>
      (function () {
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
      })();
    </script>

    <!--
      字体加载策略 —— 故意不走 Google Fonts CDN:
        1) 国内访问 fonts.googleapis.com 经常超时/慢,首屏卡顿
        2) display=swap 会先用 fallback 再切换,视觉上有"字体在变"
        3) CSS link 是 render-blocking 串行 → preconnect+link 仍然慢

      改成:
        - Inter 走系统字体后备栈(macOS 用 SF,Windows 用 Segoe UI,
          与 Inter 设计同源,视觉差异极小且无网络代价)
        - Playfair Display 自托【可变字体】woff2(wght 400–700 一个文件全覆盖,
          latin 子集 ~37KB),preload + font-display: block,
          短暂不可见 → 直接显示真字体,绝无切换感

      ⚠️ 2026-07-27:原先只自托了 700 一个静态字重,导致 font-medium(500)/
         font-normal(400) 全在跑浏览器合成假粗体 —— BrandName 的三个 tone
         渲染出来一模一样。换可变字体后三档才真正生效。
         只 preload latin;latin-ext(带变音符的欧洲语言)走 swap 按需加载。
    -->
    <link
      rel="preload"
      href="/fonts/playfair-display-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Microsoft Clarity Analytics -->
    <script>
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "u14c9rnomm");
    </script>
    <!--
      Umami tracker —— 运行时加载,website_id 由 backend 接口动态提供。
      为什么不走静态 <script data-website-id="%VITE_..."> 的方式:
        - 那种方式把 website id 编进 bundle,umami DB 重建 / 换 site 都要 rebuild 前端
        - 当 id 在 umami 不存在时 (例如复用了别项目的 UUID),/api/send 直接 400
      改成:
        1) fetch /api/v1/public/umami-config 拿到 backend 已自动 bootstrap 好的 id
        2) 动态插入 <script data-website-id="..."> 触发 tracker
        3) backend 不可达 / umami 没起 → 默默跳过,主站功能完全不受影响
    -->
    <script>
      (function () {
        fetch('/api/v1/public/umami-config', { cache: 'force-cache' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var data = resp && resp.data;
            if (!data || !data.website_id || !data.script_url) return;
            var s = document.createElement('script');
            s.defer = true;
            s.src = data.script_url;
            s.setAttribute('data-website-id', data.website_id);
            document.head.appendChild(s);
          })
          .catch(function () { /* 静默 —— 监控不可用不应该影响站点 */ });
      })();
    </script>

    <!--
      Google 分析(GA4 / GTM)—— 运行时加载,衡量 ID 由后台「系统设置」配置(/config/system)。
      自动判断:G-XXXX → 直接 gtag.js(GA4 增强衡量默认开,自动统计 SPA 路由切换);
                GTM-XXXX → GTM 容器(GA4 标签需在 GTM 后台自行配置)。
      空 / backend 不可达 → 静默跳过,不影响站点。
    -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        fetch('/api/v1/config/system')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var id = resp && resp.data && resp.data.google_analytics_id;
            if (!id) return;
            var isGTM = id.indexOf('GTM-') === 0;
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/' +
              (isGTM ? 'gtm.js?id=' : 'gtag/js?id=') + encodeURIComponent(id);
            document.head.appendChild(s);
            if (isGTM) {
              window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
            } else {
              window.gtag('js', new Date());
              window.gtag('config', id);
            }
          })
          .catch(function () { /* 静默 —— 监控不可用不应影响站点 */ });
      })();
    </script>

    <!--
      后台「代码片段库」(/admin/code-snippets)—— 运行时拉取并注入,达到「配置即生效、无需重新构建/重启」。

      为什么必须有这段(2026-07 修):
        后端早已备齐 CRUD + 公开接口 + SSR 注入,但**只有爬虫**能看到片段 —— nginx 按 UA 分流,
        爬虫走 backend SSR(ServeIndexHTML → injectCodeSnippets 注入原始 HTML),普通用户走前端静态
        SPA,压根不经过 backend。而前端这一半从没实现(公开接口零消费方),导致管理员配的片段对真实
        用户全是哑的。SSR 特地埋了 window.__SSR_SNIPPETS_INJECTED__ 防重复标记,正是留给这里用的。

      时序坑:SSR 把「flag + 片段」注入在 head 结束标签**之前**,即排在本脚本**之后**才执行。所以
      __SSR_SNIPPETS_INJECTED__ 的判断**必须放在 fetch 的 .then 里**(那时 head 已解析完、flag 已就位);
      放在脚本开头会永远读到 undefined → 爬虫(会跑 JS 的 Googlebot)会被重复注入两遍。

      ⚠️ 本注释里**绝不能出现字面量的 head/body 结束标签** —— Vite 构建时是按字符串找**第一个**
      head 结束标签插入 <script type="module"> 的,会命中注释里那个假的,把主 bundle 塞进注释里
      → 整站白屏、且控制台**没有任何报错**(浏览器只当它是注释文本,压根不请求 bundle)。踩过一次。

      安全:片段是**管理员**(adminProtected)配置的任意 HTML/JS,注入到所有用户页面 —— 这正是本功能的
      用途(等同 GTM 容器),但也意味着后台账号即全站 JS 权限,勿把该菜单开放给非可信管理员。
    -->
    <script>
      (function () {
        // 把一组片段拼成一个 fragment(保持 priority 顺序,一次性插入)。
        // 注:innerHTML 解析出的 <script> 带「已停止」标记、永不执行 → 必须逐个重建成新 script 才会跑。
        function build(list) {
          var frag = document.createDocumentFragment();
          for (var i = 0; i < list.length; i++) {
            var html = list[i] && list[i].code_content;
            if (!html) continue;
            var tpl = document.createElement('template');
            tpl.innerHTML = html;
            var scripts = tpl.content.querySelectorAll('script');
            for (var j = 0; j < scripts.length; j++) {
              var old = scripts[j];
              var s = document.createElement('script');
              for (var k = 0; k < old.attributes.length; k++) {
                s.setAttribute(old.attributes[k].name, old.attributes[k].value);
              }
              s.text = old.textContent || '';
              old.parentNode.replaceChild(s, old);
            }
            frag.appendChild(tpl.content);
          }
          return frag;
        }
        fetch('/api/v1/config/code-snippets')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var d = resp && resp.data;
            if (!d) return;
            // 见上「时序坑」:此刻 head 已解析完,爬虫的 SSR flag 若在就说明原始 HTML 已注入过。
            if (window.__SSR_SNIPPETS_INJECTED__) return;
            window.__SSR_SNIPPETS_INJECTED__ = true;
            document.head.appendChild(build(d.head || []));
            var doBody = function () {
              document.body.insertBefore(build(d.body_start || []), document.body.firstChild);
              document.body.appendChild(build(d.body_end || []));
            };
            if (document.body) doBody();
            else document.addEventListener('DOMContentLoaded', doBody);
          })
          .catch(function () { /* 静默 —— 片段拉不到不应影响主站 */ });
      })();
    </script>

    <!-- ───────── SEO 基础 meta(静态兜底)─────────
         非 JS 爬虫 / 百度首屏即可见;详情页由后端 SSR(handler_ssr.go)用正则替换 title/description/keywords。
         首页 RouteSEO(React 注入)与此处保持品牌词一致即可。 -->
    <title>Scholay学术 - AI 驱动的学术搜索与研究平台 | 论文搜索 · AI 审稿 · 文献管理</title>
    <meta
      name="description"
      content="Scholay学术(scholay)是 AI 驱动的一站式学术研究平台:智能论文搜索、AI 论文分析、AI 智能审稿、学者库、期刊查询、文献集管理与 LaTeX 在线写作。覆盖全球 2 亿+ 学术论文,助你高效科研。"
    />
    <meta
      name="keywords"
      content="Scholay,Scholay学术,Scholay科研,Scholay工具,Scholay AI,AI 学术工具,学术搜索,论文搜索,AI 论文分析,智能审稿,文献管理,期刊查询,学者库,LaTeX 在线编辑"
    />

    <!-- Open Graph / 微信 / Twitter 分享卡(首页默认;1200×630,放在 public/)

         ⚠️ 文件名带版本号是必须的,不是洁癖:og-image / favicon 都不带内容 hash,
         而 nginx 对 png/svg 发 `max-age=31536000, immutable`(frontend-user/nginx.conf
         与 nginx/conf.d/user.conf 两层都发)。**原地改文件内容,老访客与已抓取过的
         社交平台最长一年拿不到新版**。所以换品牌色时必须同时换 URL。
         og-image.png 保留同内容副本,只为让历史分享链接在缓存过期后也能自愈。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scholay学术" />
    <meta property="og:title" content="Scholay学术 - AI 驱动的学术搜索与研究平台" />
    <meta property="og:description" content="智能论文搜索、AI 审稿、文献管理、LaTeX 写作一站式平台,覆盖全球 2 亿+ 学术论文。" />
    <meta property="og:url" content="https://www.scholay.com/" />
    <meta property="og:image" content="https://www.scholay.com/og-image-v2.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scholay学术 - AI 学术搜索工具" />
    <meta name="twitter:description" content="智能论文搜索、AI 审稿、文献管理、LaTeX 写作一站式平台。" />
    <meta name="twitter:image" content="https://www.scholay.com/og-image-v2.png" />

    <!-- 结构化数据:品牌(Organization)+ 站点搜索框(WebSite/SearchAction)+ 产品(SoftwareApplication)。
         这是百度/必应「官网 + 子链(sitelinks)」与品牌知识卡的关键启用项;不写假评分(会被判作弊)。 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.scholay.com/#organization",
          "name": "Scholay学术",
          "alternateName": ["Scholay", "Scholay学术", "Scholay科研", "Scholay工具", "Scholay AI"],
          "url": "https://www.scholay.com",
          "logo": "https://www.scholay.com/favicon.svg",
          "description": "AI 驱动的学术搜索与研究平台",
          "sameAs": ["https://www.scholay.com"],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "url": "https://www.scholay.com/contact"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.scholay.com/#website",
          "name": "Scholay学术",
          "alternateName": ["Scholay", "Scholay学术", "Scholay科研", "Scholay工具", "Scholay AI"],
          "url": "https://www.scholay.com",
          "publisher": { "@id": "https://www.scholay.com/#organization" },
          "inLanguage": "zh-CN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.scholay.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Scholay学术",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "url": "https://www.scholay.com",
          "description": "AI 驱动的一站式学术研究平台:论文搜索、AI 分析、智能审稿、文献管理、LaTeX 写作。",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
        },
        {
          "@type": "ItemList",
          "name": "Scholay学术 主要功能",
          "itemListElement": [
            { "@type": "SiteNavigationElement", "position": 1, "name": "AI 文献搜索", "description": "覆盖 2 亿+ 学术论文,关键词 + 语义双引擎智能检索", "url": "https://www.scholay.com/search" },
            { "@type": "SiteNavigationElement", "position": 2, "name": "期刊查询", "description": "按影响因子、JCR 分区、ISSN 检索全球期刊", "url": "https://www.scholay.com/journals/search" },
            { "@type": "SiteNavigationElement", "position": 3, "name": "AI 智能助手", "description": "基于你的文献的 AI 学术对话与论文分析", "url": "https://www.scholay.com/claw" },
            { "@type": "SiteNavigationElement", "position": 4, "name": "AI 智能审稿", "description": "投稿前用 AI 模拟同行评审,提前发现论文问题", "url": "https://www.scholay.com/peer-review" },
            { "@type": "SiteNavigationElement", "position": 5, "name": "文献集管理", "description": "文件夹树 + AI 自动打标签,千篇文献一处归档", "url": "https://www.scholay.com/library" },
            { "@type": "SiteNavigationElement", "position": 6, "name": "全部功能", "description": "Scholay学术 全部能力总览", "url": "https://www.scholay.com/features" }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- 品牌兜底正文:非 JS 爬虫(百度 / 多数 AI 爬虫)首屏即可见,确保 scholay 各品牌变体
         都有真实 on-page 文本可关联到本站。JS 加载后由 React 接管 #root,此块不显示。 -->
