<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      字体加载策略 —— 故意不走 Google Fonts CDN:
        1) 国内访问 fonts.googleapis.com 经常超时/慢,首屏卡顿
        2) display=swap 会先用 fallback 再切换,视觉上有"字体在变"
        3) CSS link 是 render-blocking 串行 → preconnect+link 仍然慢

      改成:
        - Inter 走系统字体后备栈(macOS 用 SF,Windows 用 Segoe UI,
          与 Inter 设计同源,视觉差异极小且无网络代价)
        - Playfair Display 700 自托 woff2(品牌 logo 字体,
          ~20KB 一帧前就能拉完),preload + font-display: block,
          短暂不可见 → 直接显示真字体,绝无切换感
    -->
    <link
      rel="preload"
      href="/fonts/playfair-display-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Microsoft Clarity Analytics -->
    <script>
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "u14c9rnomm");
    </script>
    <!--
      Umami tracker —— 运行时加载,website_id 由 backend 接口动态提供。
      为什么不走静态 <script data-website-id="%VITE_..."> 的方式:
        - 那种方式把 website id 编进 bundle,umami DB 重建 / 换 site 都要 rebuild 前端
        - 当 id 在 umami 不存在时 (例如复用了别项目的 UUID),/api/send 直接 400
      改成:
        1) fetch /api/v1/public/umami-config 拿到 backend 已自动 bootstrap 好的 id
        2) 动态插入 <script data-website-id="..."> 触发 tracker
        3) backend 不可达 / umami 没起 → 默默跳过,主站功能完全不受影响
    -->
    <script>
      (function () {
        fetch('/api/v1/public/umami-config', { cache: 'force-cache' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var data = resp && resp.data;
            if (!data || !data.website_id || !data.script_url) return;
            var s = document.createElement('script');
            s.defer = true;
            s.src = data.script_url;
            s.setAttribute('data-website-id', data.website_id);
            document.head.appendChild(s);
          })
          .catch(function () { /* 静默 —— 监控不可用不应该影响站点 */ });
      })();
    </script>

    <title>Scholay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
