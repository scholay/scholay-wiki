<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: 移动端 /m 的底部导航用 env(safe-area-inset-bottom) 给全面屏 home indicator 让位
         maximum-scale=1 + user-scalable=no: 禁止页面缩放 —— ① 拦掉妨碍使用的误触放大/缩小;
         ② 同时阻止 iOS 聚焦输入框时的「自动放大」(maximum-scale=1 时 iOS 不再 focus-zoom)。
         注:桌面浏览器 Ctrl± 缩放不受 viewport 影响,仅作用移动端。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS Safari 出于无障碍会忽略 viewport 的 user-scalable=no 对「用户捏合」的限制,
         需 JS 拦截 Safari 私有 gesture 事件才能真正禁掉双指捏合放大(双击放大由 CSS touch-action 拦)。
         其他浏览器无 gesture 事件,addEventListener 即 no-op,无副作用。 -->
    <script>
      (function () {
        var stop = function (e) { e.preventDefault(); };
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('gesturechange', stop, { passive: false });
        document.addEventListener('gestureend', stop, { passive: false });
      })();
    </script>

    <!--
      字体加载策略 —— 故意不走 Google Fonts CDN:
        1) 国内访问 fonts.googleapis.com 经常超时/慢,首屏卡顿
        2) display=swap 会先用 fallback 再切换,视觉上有"字体在变"
        3) CSS link 是 render-blocking 串行 → preconnect+link 仍然慢

      改成:
        - Inter 走系统字体后备栈(macOS 用 SF,Windows 用 Segoe UI,
          与 Inter 设计同源,视觉差异极小且无网络代价)
        - Playfair Display 700 自托 woff2(品牌 logo 字体,
          ~20KB 一帧前就能拉完),preload + font-display: block,
          短暂不可见 → 直接显示真字体,绝无切换感
    -->
    <link
      rel="preload"
      href="/fonts/playfair-display-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Microsoft Clarity Analytics -->
    <script>
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "u14c9rnomm");
    </script>
    <!--
      Umami tracker —— 运行时加载,website_id 由 backend 接口动态提供。
      为什么不走静态 <script data-website-id="%VITE_..."> 的方式:
        - 那种方式把 website id 编进 bundle,umami DB 重建 / 换 site 都要 rebuild 前端
        - 当 id 在 umami 不存在时 (例如复用了别项目的 UUID),/api/send 直接 400
      改成:
        1) fetch /api/v1/public/umami-config 拿到 backend 已自动 bootstrap 好的 id
        2) 动态插入 <script data-website-id="..."> 触发 tracker
        3) backend 不可达 / umami 没起 → 默默跳过,主站功能完全不受影响
    -->
    <script>
      (function () {
        fetch('/api/v1/public/umami-config', { cache: 'force-cache' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var data = resp && resp.data;
            if (!data || !data.website_id || !data.script_url) return;
            var s = document.createElement('script');
            s.defer = true;
            s.src = data.script_url;
            s.setAttribute('data-website-id', data.website_id);
            document.head.appendChild(s);
          })
          .catch(function () { /* 静默 —— 监控不可用不应该影响站点 */ });
      })();
    </script>

    <!--
      Google 分析(GA4 / GTM)—— 运行时加载,衡量 ID 由后台「系统设置」配置(/config/system)。
      自动判断:G-XXXX → 直接 gtag.js(GA4 增强衡量默认开,自动统计 SPA 路由切换);
                GTM-XXXX → GTM 容器(GA4 标签需在 GTM 后台自行配置)。
      空 / backend 不可达 → 静默跳过,不影响站点。
    -->
    <script>
      (function () {
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
        fetch('/api/v1/config/system')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (resp) {
            var id = resp && resp.data && resp.data.google_analytics_id;
            if (!id) return;
            var isGTM = id.indexOf('GTM-') === 0;
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://www.googletagmanager.com/' +
              (isGTM ? 'gtm.js?id=' : 'gtag/js?id=') + encodeURIComponent(id);
            document.head.appendChild(s);
            if (isGTM) {
              window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
            } else {
              window.gtag('js', new Date());
              window.gtag('config', id);
            }
          })
          .catch(function () { /* 静默 —— 监控不可用不应影响站点 */ });
      })();
    </script>

    <!-- ───────── SEO 基础 meta(静态兜底)─────────
         非 JS 爬虫 / 百度首屏即可见;详情页由后端 SSR(handler_ssr.go)用正则替换 title/description/keywords。
         首页 RouteSEO(React 注入)与此处保持品牌词一致即可。 -->
    <title>Scholay学术 - AI 驱动的学术搜索与研究平台 | 论文搜索 · AI 审稿 · 文献管理</title>
    <meta

      content="Scholay学术(scholay)是 AI 驱动的一站式学术研究平台:智能论文搜索、AI 论文分析、AI 智能审稿、学者库、期刊查询、文献集管理与 LaTeX 在线写作。覆盖全球 2 亿+ 学术论文,助你高效科研。"
    />
    <meta
      name="keywords"
      content="Scholay,Scholay学术,scholay学术,scholay学术工具,scholay ai 学术工具,scholay scholar,scholar,AI 学术工具,学术搜索,论文搜索,AI 论文分析,智能审稿,文献管理,期刊查询,学者库,LaTeX 在线编辑"
    />

    <!-- Open Graph / 微信 / Twitter 分享卡(首页默认;og-image.png 需放到 public/,1200×630) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scholay学术" />
    <meta property="og:title" content="Scholay学术 - AI 驱动的学术搜索与研究平台" />
    <meta property="og:description" content="智能论文搜索、AI 审稿、文献管理、LaTeX 写作一站式平台,覆盖全球 2 亿+ 学术论文。" />
    <meta property="og:url" content="https://www.scholay.com/" />
    <meta property="og:image" content="https://www.scholay.com/og-image.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scholay学术 - AI 学术搜索工具" />
    <meta name="twitter:description" content="智能论文搜索、AI 审稿、文献管理、LaTeX 写作一站式平台。" />
    <meta name="twitter:image" content="https://www.scholay.com/og-image.png" />

    <!-- 结构化数据:品牌(Organization)+ 站点搜索框(WebSite/SearchAction)+ 产品(SoftwareApplication)。
         这是百度/必应「官网 + 子链(sitelinks)」与品牌知识卡的关键启用项;不写假评分(会被判作弊)。 -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.scholay.com/#organization",
          "name": "Scholay学术",
          "alternateName": ["Scholay", "scholay学术", "scholay学术工具"],
          "url": "https://www.scholay.com",
          "logo": "https://www.scholay.com/favicon.svg",
          "description": "AI 驱动的学术搜索与研究平台",
          "sameAs": ["https://www.scholay.com"],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "support@scholay.app"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.scholay.com/#website",
          "name": "Scholay学术",
          "alternateName": "Scholay",
          "url": "https://www.scholay.com",
          "publisher": { "@id": "https://www.scholay.com/#organization" },
          "inLanguage": "zh-CN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.scholay.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Scholay学术",
          "applicationCategory": "EducationalApplication",
          "operatingSystem": "Web",
          "url": "https://www.scholay.com",
          "description": "AI 驱动的一站式学术研究平台:论文搜索、AI 分析、智能审稿、文献管理、LaTeX 写作。",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
        },
        {
          "@type": "ItemList",
          "name": "Scholay学术 主要功能",
          "itemListElement": [
            { "@type": "SiteNavigationElement", "position": 1, "name": "AI 文献搜索", "description": "覆盖 2 亿+ 学术论文,关键词 + 语义双引擎智能检索", "url": "https://www.scholay.com/search" },
            { "@type": "SiteNavigationElement", "position": 2, "name": "期刊查询", "description": "按影响因子、JCR 分区、ISSN 检索全球期刊", "url": "https://www.scholay.com/journals/search" },
            { "@type": "SiteNavigationElement", "position": 3, "name": "AI 智能助手", "description": "基于你的文献的 AI 学术对话与论文分析", "url": "https://www.scholay.com/claw" },
            { "@type": "SiteNavigationElement", "position": 4, "name": "AI 智能审稿", "description": "投稿前用 AI 模拟同行评审,提前发现论文问题", "url": "https://www.scholay.com/peer-review" },
            { "@type": "SiteNavigationElement", "position": 5, "name": "文献集管理", "description": "文件夹树 + AI 自动打标签,千篇文献一处归档", "url": "https://www.scholay.com/library" },
            { "@type": "SiteNavigationElement", "position": 6, "name": "全部功能", "description": "Scholay学术 全部能力总览", "url": "https://www.scholay.com/features" }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
