<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      字体加载策略 —— 故意不走 Google Fonts CDN:
        1) 国内访问 fonts.googleapis.com 经常超时/慢,首屏卡顿
        2) display=swap 会先用 fallback 再切换,视觉上有"字体在变"
        3) CSS link 是 render-blocking 串行 → preconnect+link 仍然慢

      改成:
        - Inter 走系统字体后备栈(macOS 用 SF,Windows 用 Segoe UI,
          与 Inter 设计同源,视觉差异极小且无网络代价)
        - Playfair Display 700 自托 woff2(品牌 logo 字体,
          ~20KB 一帧前就能拉完),preload + font-display: block,
          短暂不可见 → 直接显示真字体,绝无切换感
    -->
    <link
      rel="preload"
      href="/fonts/playfair-display-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      分析:Microsoft Clarity(行为录屏 / heatmap) + Umami(自托管 KPI 统计)
      两者并存 —— Clarity 看用户交互回放,Umami 看 PV / UV / 事件 / 留存。
      Umami tracker 走独立端口(prebuilt 镜像不支持运行时 BASE_PATH,所以不走路径前缀);
      data-website-id 在 Umami 控制台创建 Website 后取得,build-time 由
      VITE_UMAMI_WEBSITE_ID 注入;为空 / 未替换时 tracker 不会上报(降级安全)。
    -->
    <!-- Microsoft Clarity Analytics -->
    <script>
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "u14c9rnomm");
    </script>
    <!--
      Umami Analytics —— 自托管, 嵌入到主 nginx 的 /umami-embed/* 通道。
      Tracker 走 /umami-embed/script.js (public, exact match 跳过 auth_request),
      事件上报到 /umami-embed/api/send。两个端点都在 nginx v2.conf 显式开放。
      旧的独立端口 5413 已下线 —— umami 完全不对外暴露, 管理控制台必须从
      admin /analytics 走 iframe + auth_request 进。
    -->
    <script
      defer
      src="/umami-embed/script.js"
      data-website-id="%VITE_UMAMI_WEBSITE_ID%"
    ></script>

    <title>Scholay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
