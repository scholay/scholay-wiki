<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Scholay favicon —— 用 Figma 品牌标本体(ScholayMark / node 1:220,六芒星中的犀牛头)。
       此前这里是一个【手搓的 S 字母】贴在朱砂方块上,与站内 logo 完全是两个东西,
       所以标签页看起来"还是旧的"。2026-07-28 换成真标志。

       ⚠️ path 直接来自 ScholayMark.tsx,颜色写死(朱砂/松青/琥珀),**不要手改** ——
          改标志 = 改品牌,须先更新 Figma 再重新导出,两处一起换。

       为什么带米白底而不是透明:标志的朱砂 #882828 与松青 #2F4D29 都是暗色,
       透明底在【深色标签栏】上会糊掉。米白底同时也是页面底色,观感一致。

       为什么只留 ~4px 边距:16px 下这个标的细节本就吃紧,留白越多越糊。
       实测 16px 只能辨出"彩色六芒星"、32px(2x 屏的实际渲染档)可辨轮廓。 -->
  <rect width="64" height="64" rx="12" fill="#F6F4EE"/>
  <g transform="translate(3.25, 2.00) scale(0.22727)">
