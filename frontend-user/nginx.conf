server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 字体单独一组 —— 需要 CORS 头,因为 <link rel="preload" as="font" crossorigin>
    # 不返回 ACAO 会被浏览器忽略 preload,重新发起一次普通请求(等于白做)
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ES module(pdfjs worker 等)—— nginx Alpine 默认 mime.types 不映射 .mjs,
    # 会回退到 application/octet-stream,Chrome 严格 MIME check 拒载 ES module
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其余静态资源 — 一年强缓存,文件名带 hash
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html /index.html;
    }
}
