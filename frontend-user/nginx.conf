server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 隐藏文件一律拒绝。直接动因:docker-entrypoint.d/40-sync-site.sh 会把发版清单写在
    # /assets/.manifests/(必须落在挂载内才能跨容器重建存活),那是内部数据不该对外;
    # 顺带也挡住 .env / .git 之类误落 web root 的文件。
    # ⚠️ 必须放在所有 location 之前 —— nginx 的正则 location 按【出现顺序】首个命中生效,
    #    写在下面会被 \.js$ 那条抢先匹配掉。
    # 排除 .well-known:那是 ACME/HTTP-01 签证书的标准路径,以后要用别被这条挡死。
    # 尾斜杠不能省 —— `(?!well-known)` 是【前缀】排除,会连 /.well-knownsecret 一起放行;
    # 加上 / 才是【整段】排除。
    #
    # ⚠️ 还有一个比"正则顺序"更隐蔽的架空方式:任何 `^~ /assets/` 或 `= /xxx` 形式的
    #    location 都在**前缀匹配阶段**胜出,根本轮不到正则,写在哪一行都拦不住。
    #    将来若要给 /assets/ 单独配 expires / gzip_static(很自然的动机),
    #    记得在那个 location 里补一条 deny,否则 .manifests 会重新暴露。
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # 根级【不带内容 hash】的品牌资产 —— 必须短 TTL,不能跟着下面那条正则吃 1y immutable。
    #
    # 踩坑记录(2026-07-28):favicon.svg 由旧品牌红 #CC2222 改成朱砂 #882828、
    # og-image.png 换成米白底的新设计,但两者都是**固定文件名**。被打上 immutable 后
    # 浏览器在一年内根本不会回源校验 —— 老访客、以及已抓取过的社交平台,
    # 看到的永远是旧品牌色。原地改内容对他们完全无效。
    #
    # 双保险:① 这里降到 1 天,让存量缓存最多一天后自愈;
    #        ② index.html 侧同时换 URL(favicon.svg?v=2 / og-image-v2.png)让新访客立即拿到新版。
    # 将来再换品牌资产,**两件事都要做**,只做其中一件都会留下长尾旧版。
    location ~* ^/(favicon\.svg|og-image[a-z0-9-]*\.png|apple-touch-icon[a-z0-9-]*\.png|manifest\.webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # 字体单独一组 —— 需要 CORS 头,因为 <link rel="preload" as="font" crossorigin>
    # 不返回 ACAO 会被浏览器忽略 preload,重新发起一次普通请求(等于白做)
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # ES module(pdfjs worker 等)—— nginx Alpine 默认 mime.types 不映射 .mjs,
    # 会回退到 application/octet-stream,Chrome 严格 MIME check 拒载 ES module
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 其余静态资源 — 一年强缓存,文件名带 hash
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/index.html /index.html;
    }
}
