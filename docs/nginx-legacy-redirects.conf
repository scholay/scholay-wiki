## Nginx 真 HTTP 301 重定向片段 —— 旧 frontend-user 路径 → 新 frontend-v2 路径
##
## 用途:在 Nginx 反向代理层面对外返回真正的 301 状态码,SEO 爬虫(Google /
## Bing / 百度)能正确传递权重。前端 React Router 的 `<Navigate>` 是客户端
## soft redirect(返回 200 + JS 跳转),做用户体验够用,但 SEO 不如 server 301。
##
## 用法:把下面的 location 段粘到对应 server { ... } 块的顶部(在 location /
## 之前),Nginx 会优先匹配。
##
## 注意:
##   - 这些 redirect 必须在反向代理 / SPA fallback 之前,否则会被 try_files
##     吞掉。
##   - $args 转发 query 参数;$is_args 自动判断要不要加 `?`。
##   - 不包含 /alipay-return(支付回调,等支付功能上线再统一处理)。
##

## ── 搜索类 ───────────────────────────────────────────────────────
# /search-results → /search
location = /search-results {
    return 301 /search$is_args$args;
}
# /search-results/<slug> → /search?q=<slug>
location ~* ^/search-results/(.+)$ {
    return 301 /search?q=$1;
}
# /advanced-search → /search
location = /advanced-search {
    return 301 /search$is_args$args;
}

## ── 期刊 ─────────────────────────────────────────────────────────
location = /journals {
    return 301 /journals/search$is_args$args;
}

## ── 论文 / 作者 SEO slug ────────────────────────────────────────
# 旧前端这两类已经是 redirect 到 /,保持同行为
location ~* ^/paper/.+$ {
    return 301 /;
}
location ~* ^/author/.+$ {
    return 301 /;
}

## ── 智能写作 / 助手 重命名 ──────────────────────────────────────
location = /latex-writer {
    return 301 /prism$is_args$args;
}
location = /assistant {
    return 301 /claw$is_args$args;
}
location = /chat {
    return 301 /claw$is_args$args;
}

## ── peer-review v2 → 主版本 ────────────────────────────────────
location = /peer-review-v2 {
    return 301 /peer-review$is_args$args;
}

## ── 宣传页:旧 /features/latex-writer → /features/prism ─────────
location = /features/latex-writer {
    return 301 /features/prism$is_args$args;
}

## ── Admin 收藏链接兼容(SEO 不重要,但用户体验照顾)──────────
location = /admin/feedbacks {
    return 301 /admin/feedback;
}
location = /admin/prompt-templates {
    return 301 /admin/prompts;
}
location = /admin/config/third-party {
    return 301 /admin/third-party;
}
location = /admin/config/payment {
    return 301 /admin/payment;
}
location = /admin/config/oauth {
    return 301 /admin/oauth;
}
location = /admin/config/platform {
    return 301 /admin/system;
}
location ^~ /dashboard/ {
    return 301 /admin;
}
