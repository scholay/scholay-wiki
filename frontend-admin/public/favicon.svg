<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 简化的波纹 -->
  <path d="M 50 15 A 35 35 0 0 1 85 50 A 35 35 0 0 1 50 85" fill="none" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 50 85 A 35 35 0 0 1 15 50 A 35 35 0 0 1 50 15" fill="none" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- 地球 -->
  <circle cx="50" cy="42" r="18" fill="url(#globeGrad)" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 经纬线 -->
  <ellipse cx="50" cy="42" rx="18" ry="8" fill="none" stroke="#E0F2FE" stroke-width="1" opacity="0.6"/>
  <ellipse cx="50" cy="42" rx="8" ry="18" fill="none" stroke="#E0F2FE" stroke-width="1" opacity="0.6"/>

  <!-- 大陆 -->
  <path d="M 45 37 Q 43 35 42 37 Q 41 39 42 41 Q 44 42 45 40 Z" fill="#E0F2FE" opacity="0.9"/>
  <path d="M 53 36 L 55 35 L 56 37 L 55 39 L 53 38 Z" fill="#E0F2FE" opacity="0.9"/>

  <!-- 书本 -->
  <path d="M 25 65 Q 27 61 35 60 Q 43 59.5 48 61 Q 49.5 61.5 50 64 L 50 85 Q 49 83 43 82.5 Q 35 82 27 83 Q 25 83.5 25 86 Z" fill="url(#bookGrad)" stroke="#0F172A" stroke-width="1.5"/>
  <path d="M 75 65 Q 73 61 65 60 Q 57 59.5 52 61 Q 50.5 61.5 50 64 L 50 85 Q 51 83 57 82.5 Q 65 82 73 83 Q 75 83.5 75 86 Z" fill="url(#bookGrad)" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 书本中缝 -->
  <line x1="50" y1="64" x2="50" y2="85" stroke="#0F172A" stroke-width="2"/>

  <!-- 高光 -->
  <circle cx="46" cy="38" r="4" fill="white" opacity="0.3"/>
</svg>
